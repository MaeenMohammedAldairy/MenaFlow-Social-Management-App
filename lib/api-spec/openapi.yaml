openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: ai
    description: Secure AI content generation
  - name: auth
    description: Owner access control
  - name: social
    description: Social account connections
  - name: posts
    description: Post management and synchronization
  - name: notifications
    description: Push notification device registration
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /ai/content:
    post:
      operationId: generateAiContent
      tags: [ai]
      security:
        - bearerAuth: []
      summary: Generate Arabic social media content
      description: Generates a draft using a server-side AI provider key. Requires an authenticated owner session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiContentInput"
      responses:
        "200":
          description: Generated content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiContentResponse"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Generation limit reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: AI provider failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Provider key is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /auth/access:
    get:
      operationId: getOwnerAccess
      tags: [auth]
      security:
        - bearerAuth: []
      summary: Get access and onboarding status for the signed-in user
      responses:
        "200":
          description: Owner access result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthAccessResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Owner access is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /workspaces:
    get:
      operationId: listWorkspaces
      tags: [auth]
      security:
        - bearerAuth: []
      summary: List workspaces the signed-in user belongs to
      responses:
        "200":
          description: Workspace memberships
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceListResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /workspaces/current:
    patch:
      operationId: updateWorkspaceCurrent
      tags: [auth]
      security:
        - bearerAuth: []
      summary: Update the current workspace's business name and type
      description: Owner-only. Backs the concise post-signup setup and the dashboard checklist edit path.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceUpdateInput"
      responses:
        "200":
          description: The updated workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceSummary"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Not the workspace owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /workspaces/current/deletion-request:
    get:
      operationId: getWorkspaceDeletionRequest
      tags: [auth]
      security:
        - bearerAuth: []
      summary: Get the current workspace deletion request, if any
      responses:
        "200":
          description: The pending request, or null when none exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceDeletionRequestResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Owner role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      operationId: createWorkspaceDeletionRequest
      tags: [auth]
      security:
        - bearerAuth: []
      summary: Record an owner deletion request; the worker erases the workspace after a 30-day grace period
      responses:
        "201":
          description: Request recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceDeletionRequestCreatedResponse"
        "200":
          description: An existing pending request was returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceDeletionRequestCreatedResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Owner role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /workspaces/current/export:
    get:
      operationId: exportWorkspaceData
      tags: [auth]
      security:
        - bearerAuth: []
      summary: Export the current workspace's merchant data as a JSON download
      description: >-
        Owner-only. Produces a single JSON document with the workspace profile,
        members, posts, products, orders, inbox conversations and subscription
        state. Secrets (Meta/WhatsApp tokens) are never included — connections
        appear as masked metadata only.
      responses:
        "200":
          description: The workspace export document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceExport"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Owner role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /subscription:
    get:
      operationId: getSubscription
      tags: [auth]
      security:
        - bearerAuth: []
      summary: Get the current workspace plan and monthly usage
      responses:
        "200":
          description: Current plan, usage, and available plan options
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionOverview"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Workspace selection required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /onboarding:
    get:
      operationId: getOnboardingStatus
      tags: [auth]
      security:
        - bearerAuth: []
      summary: Get onboarding progress for the current workspace
      responses:
        "200":
          description: Current onboarding state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingStatus"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Workspace selection required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /onboarding/progress:
    post:
      operationId: updateOnboardingProgress
      tags: [auth]
      security:
        - bearerAuth: []
      summary: Save onboarding progress for the current workspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OnboardingProgressInput"
      responses:
        "200":
          description: Updated onboarding state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingStatus"
        "400":
          description: Invalid progress action
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Workspace selection required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /onboarding/social-accounts/complete:
    post:
      operationId: completeSocialAccountsSetup
      tags: [auth]
      security:
        - bearerAuth: []
      summary: Mark social account setup complete for the current workspace
      responses:
        "200":
          description: Completed social account setup state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingStatus"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Workspace selection required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /social/connections:
    get:
      operationId: getSocialConnections
      tags: [social]
      security:
        - bearerAuth: []
      summary: Get the owner's connected social accounts
      responses:
        "200":
          description: Current social account connections
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SocialConnectionsResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /social/meta/connect:
    post:
      operationId: postMetaConnect
      tags: [social]
      security:
        - bearerAuth: []
      summary: Start Facebook or Instagram account authorization
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MetaConnectInput"
      responses:
        "200":
          description: Meta authorization link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetaConnectResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Meta connection is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /social/meta:
    delete:
      operationId: deleteMetaConnection
      tags: [social]
      security:
        - bearerAuth: []
      summary: Disconnect a Meta platform account owned by the authenticated user
      parameters:
        - name: platform
          in: query
          required: false
          description: Defaults to facebook for compatibility; disconnecting Facebook also removes its linked Instagram account.
          schema:
            type: string
            enum: [facebook, instagram]
      responses:
        "200":
          description: Connection removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetaDisconnectResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /social/meta/callback:
    get:
      operationId: metaOAuthCallback
      tags: [social]
      summary: Complete the Meta authorization callback
      responses:
        "302":
          description: Redirects back to the MenaFlow mobile app
  /social/whatsapp/connect:
    post:
      operationId: postWhatsAppPairingCode
      tags: [social]
      security:
        - bearerAuth: []
      summary: Reuse or create a workspace Evolution instance and request phone-code or QR pairing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WhatsAppPairingCodeInput"
      responses:
        "200":
          description: Workspace Evolution instance reused or created and pairing code generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhatsAppPairingCodeResponse"
        "400":
          description: Invalid phone number
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: WhatsApp is already connected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
          description: Evolution API could not generate a pairing code for the phone number
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Evolution API request failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Evolution API is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /social/whatsapp/connection-status:
    get:
      operationId: getWhatsAppConnectionStatus
      tags: [social]
      security:
        - bearerAuth: []
      summary: Check the live Evolution API connection state for the owner's pending instance
      parameters:
        - name: instanceName
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Current normalized Evolution state; unavailable means the provider returned an unknown state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhatsAppConnectionStatus"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: No matching pending WhatsApp connection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Evolution API request failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /social/whatsapp/auto-reply-settings:
    get:
      operationId: getWhatsAppAutoReplySettings
      tags: [social]
      security:
        - bearerAuth: []
      summary: Get the current workspace WhatsApp automatic-reply settings
      responses:
        "200":
          description: Current WhatsApp connection and automatic-reply settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhatsAppAutoReplySettingsResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: No WhatsApp connection found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    put:
      operationId: saveWhatsAppAutoReplySettings
      tags: [social]
      security:
        - bearerAuth: []
      summary: Save and optionally enable tested WhatsApp automatic replies
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WhatsAppAutoReplySettings"
      responses:
        "200":
          description: Settings saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhatsAppAutoReplySettings"
        "400":
          description: Invalid settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: WhatsApp is disconnected or the current settings have not been tested
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: AI provider is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /social/whatsapp/auto-reply-test:
    post:
      operationId: testWhatsAppAutoReply
      tags: [social]
      security:
        - bearerAuth: []
      summary: Generate a test preview without sending a WhatsApp message
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WhatsAppAutoReplyTestInput"
      responses:
        "200":
          description: Generated test reply preview
          content:
            application/json:
              schema:
                type: object
                properties:
                  reply:
                    type: string
                required: [reply]
        "400":
          description: Invalid test message or settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: WhatsApp is disconnected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Test generation rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: AI provider is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /social/whatsapp/groups:
    get:
      operationId: getWhatsAppGroups
      tags: [social]
      security:
        - bearerAuth: []
      summary: Fetch WhatsApp announcement groups for the owner's connected account
      responses:
        "200":
          description: Live announcement groups without participant or permission details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhatsAppGroupsResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: No WhatsApp account connected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: WhatsApp connection is not active
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Evolution API request failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /social/whatsapp/group-selections:
    get:
      operationId: getWhatsAppGroupSelections
      tags: [social]
      security:
        - bearerAuth: []
      summary: Get the current owner's saved WhatsApp group selections
      responses:
        "200":
          description: Saved selections for the current WhatsApp instance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhatsAppGroupSelectionsResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    put:
      operationId: saveWhatsAppGroupSelections
      tags: [social]
      security:
        - bearerAuth: []
      summary: Save selected announcement group JIDs for the current WhatsApp instance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WhatsAppGroupSelectionsInput"
      responses:
        "200":
          description: Announcement group selections saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhatsAppGroupSelectionsResponse"
        "400":
          description: Invalid selection input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: No WhatsApp account connected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: WhatsApp connection is not active
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
          description: A selected group is not currently eligible
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Evolution API request failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /social/whatsapp:
    delete:
      operationId: deleteWhatsAppConnection
      tags: [social]
      security:
        - bearerAuth: []
      summary: Disconnect WhatsApp or cancel a pending pairing
      parameters:
        - in: query
          name: cancelPairing
          required: false
          description: Cancel only an in-progress pairing without deleting saved workspace settings
          schema:
            type: boolean
      responses:
        "200":
          description: WhatsApp disconnected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhatsAppDisconnectResult"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /social/products/whatsapp-extractions:
    get:
      operationId: getWhatsAppProductExtractions
      tags: [products]
      security:
        - bearerAuth: []
      summary: List product suggestions extracted from WhatsApp messages
      description: >-
        Returns the review queue together with the extraction job counters, so a
        client can explain why nothing new appeared (a pending download, an
        association decision the merchant owes, or a failure).
      responses:
        "200":
          description: Suggestions and extraction queue state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductExtractionListResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /social/products/extract-whatsapp:
    post:
      operationId: extractWhatsAppProductMessages
      tags: [products]
      security:
        - bearerAuth: []
      summary: Queue imported WhatsApp messages for product extraction
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExtractWhatsAppProductsInput"
      responses:
        "202":
          description: Messages queued for the extraction worker
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExtractWhatsAppProductsResponse"
        "400":
          description: Invalid message identifier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: The queue could not be scheduled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /social/products/whatsapp-extractions/{suggestionId}/create-draft:
    post:
      operationId: createProductExtractionDraft
      tags: [products]
      security:
        - bearerAuth: []
      summary: Turn a suggestion into a product draft
      description: >-
        Without a body the extracted data is used as-is. A `product` body creates
        a draft from merchant-supplied values, which is also the way to resolve a
        possible duplicate or to keep a message the model classified as
        not-a-product.
      parameters:
        - $ref: "#/components/parameters/ProductSuggestionId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProductDraftInput"
      responses:
        "201":
          description: Draft created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductDraftResponse"
        "400":
          description: Invalid suggestion identifier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Suggestion not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: The suggestion needs review or its duplicate resolved first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
          description: No product name could be extracted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /social/products/whatsapp-extractions/{suggestionId}/dismiss:
    post:
      operationId: dismissProductExtractionSuggestion
      tags: [products]
      security:
        - bearerAuth: []
      summary: Dismiss a suggestion that is not a product
      parameters:
        - $ref: "#/components/parameters/ProductSuggestionId"
      responses:
        "200":
          description: Suggestion dismissed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductExtractionDismissResponse"
        "400":
          description: Invalid suggestion identifier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: No dismissible suggestion found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /social/products/whatsapp-extractions/{suggestionId}/review:
    post:
      operationId: reviewProductExtractionSuggestion
      tags: [products]
      security:
        - bearerAuth: []
      summary: Record whether one extracted field was correct
      description: >-
        Field-level feedback is stored on the suggestion and feeds the extraction
        benchmark, so a model change can be measured against merchant verdicts.
      parameters:
        - $ref: "#/components/parameters/ProductSuggestionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductExtractionReviewInput"
      responses:
        "200":
          description: Review recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductExtractionReviewResponse"
        "400":
          description: Invalid review payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: No reviewable suggestion found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /social/products/publish:
    post:
      operationId: publishCatalogProducts
      tags: [products]
      security:
        - bearerAuth: []
      summary: Queue approved products for publication to Meta channels
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublishCatalogProductsInput"
      responses:
        "202":
          description: Publication jobs queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductPublicationSnapshot"
        "400":
          description: Invalid publication request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: One of the selected products does not exist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: >-
            Meta is not connected, a selected account no longer matches the
            connection, a product is still a draft, or a product is missing
            fields a listing needs (code PRODUCT_FIELDS_INCOMPLETE lists them).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductPublicationConflict"
  /social/whatsapp/reconfigure-webhook:
    post:
      operationId: reconfigureWhatsAppWebhook
      tags: [social]
      security:
        - bearerAuth: []
      summary: Re-register the Evolution webhook for this workspace instance
      description: >-
        Pairing already configures the webhook; this covers the cases that break
        it afterwards (a rotated secret, a moved API domain) without re-pairing.
        The response carries the exact URL that was registered.
      responses:
        "200":
          description: Webhook re-registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhatsAppWebhookReconfiguration"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: No WhatsApp connection in this workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Evolution API rejected the configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: >-
            The webhook secret or the public API URL is not configured on the
            server (code names the missing variable)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /social/meta-auto-replies:
    get:
      operationId: getMetaAutoReplySettings
      tags: [social]
      security:
        - bearerAuth: []
      summary: Get Meta automatic-reply settings, readiness and inbound facts
      responses:
        "200":
          description: Settings, per-platform readiness and inbound diagnostics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetaAutoReplySettingsResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /social/meta-inbox/webhook-subscriptions:
    post:
      operationId: activateMetaWebhookSubscriptions
      tags: [social]
      security:
        - bearerAuth: []
      summary: Renew the Meta webhook subscriptions for the connected accounts
      responses:
        "200":
          description: Subscriptions renewed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetaWebhookSubscriptionsResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: No Meta connection, or the token needs re-authorization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Meta rejected one of the subscription requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetaWebhookSubscriptionsResponse"
        "503":
          description: MENA_META_WEBHOOK_VERIFY_TOKEN is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /posts:
    get:
      operationId: getPosts
      tags: [posts]
      security:
        - bearerAuth: []
      summary: Get all posts for the current owner
      responses:
        "200":
          description: List of posts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PostItem"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      operationId: createPost
      tags: [posts]
      security:
        - bearerAuth: []
      summary: Create a new post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePostInput"
      responses:
        "201":
          description: Post created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostItem"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /posts/page:
    get:
      operationId: getPostsPage
      tags: [posts]
      security:
        - bearerAuth: []
      summary: Get a page of posts for the active workspace
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
        - name: cursor
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: One keyset-paginated page of posts
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/PostItem"
                  nextCursor:
                    type: string
                    nullable: true
                required: [items, nextCursor]
        "400":
          description: Invalid page size or cursor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /posts/report-summary:
    get:
      operationId: getPostReportSummary
      tags: [posts]
      security:
        - bearerAuth: []
      summary: Get workspace post report totals
      parameters:
        - name: range
          in: query
          required: true
          schema:
            type: string
            enum: ["7", "30", all]
      responses:
        "200":
          description: Aggregated workspace post counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostReportSummary"
        "400":
          description: Invalid report range
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /posts/known-ids:
    post:
      operationId: getKnownPostIds
      tags: [posts]
      security:
        - bearerAuth: []
      summary: Check cached post IDs in the active workspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KnownPostIdsInput"
      responses:
        "200":
          description: IDs already stored in the active workspace
          content:
            application/json:
              schema:
                type: object
                properties:
                  ids:
                    type: array
                    items:
                      type: string
                required: [ids]
        "400":
          description: Invalid ID list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /posts/{id}:
    patch:
      operationId: updatePost
      tags: [posts]
      security:
        - bearerAuth: []
      summary: Update a post
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePostInput"
      responses:
        "200":
          description: Post updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostItem"
        "404":
          description: Post not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: deletePost
      tags: [posts]
      security:
        - bearerAuth: []
      summary: Delete a post
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Post deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostDeleteResult"
        "404":
          description: Post not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /notifications/push-token:
    post:
      operationId: registerPushToken
      tags: [notifications]
      security:
        - bearerAuth: []
      summary: Register this device for push notifications
      description: >-
        Records an Expo push token for the signed-in user. Idempotent by design:
        the client re-registers on every cold start, so an existing token
        refreshes its last-seen timestamp instead of creating a second row. At
        most ten devices are kept per user and the least recently seen is
        evicted, because every alert fans out to all of a recipient's tokens.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushTokenInput"
      responses:
        "201":
          description: Token recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushTokenRegisteredResponse"
        "400":
          description: Token or platform rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: unregisterPushToken
      tags: [notifications]
      security:
        - bearerAuth: []
      summary: Remove a push token belonging to the signed-in user
      description: >-
        Called on sign-out. A user can only remove their own tokens; removing
        somebody else's is refused by scoping the delete to the caller.
      parameters:
        - name: token
          in: query
          required: true
          description: The token string to remove
          schema:
            type: string
            minLength: 20
            maxLength: 200
      responses:
        "200":
          description: Removal result; removed is false when no such token existed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushTokenRemovedResponse"
        "400":
          description: Token missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /notifications/push-tokens:
    get:
      operationId: listPushTokens
      tags: [notifications]
      security:
        - bearerAuth: []
      summary: List the devices registered to the signed-in user
      responses:
        "200":
          description: Registered devices, most recently seen first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushTokenListResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    ProductSuggestionId:
      name: suggestionId
      in: path
      required: true
      description: Identifier of the extraction suggestion
      schema:
        type: string
        pattern: "^[0-9a-fA-F-]{36}$"
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    AiContentInput:
      type: object
      additionalProperties: false
      properties:
        idea:
          type: string
          minLength: 3
          maxLength: 1200
        businessContext:
          type: string
          maxLength: 500
        provider:
          type: string
          enum: [gemini, openai]
        tone:
          type: string
          enum: [professional, friendly, promotional, concise]
        channel:
          type: string
          enum: [instagram, facebook, whatsapp]
      required: [idea, provider, tone, channel]
    AiContentResponse:
      type: object
      properties:
        content:
          type: string
        provider:
          type: string
          enum: [gemini, openai]
        model:
          type: string
      required: [content, provider, model]
    ApiError:
      type: object
      properties:
        error:
          type: string
        code:
          type: string
        requestId:
          type: string
      required: [error]
    AuthAccessResponse:
      type: object
      properties:
        authorized:
          type: boolean
        onboarding:
          $ref: "#/components/schemas/OnboardingStatus"
      required: [authorized, onboarding]
    WorkspaceListResponse:
      type: object
      properties:
        workspaces:
          type: array
          items:
            $ref: "#/components/schemas/WorkspaceSummary"
      required: [workspaces]
    WorkspaceSummary:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        businessType:
          type: string
          nullable: true
        country:
          type: string
          nullable: true
          description: ISO 3166-1 alpha-2 country code.
        timezone:
          type: string
          description: IANA timezone used to display and capture scheduled times.
        role:
          type: string
      required: [id, name, role]
    # Named to avoid orval's operation-derived zod const names
    # (updateWorkspaceCurrent => UpdateWorkspaceCurrentBody/Response); a component
    # sharing those exact names collides with the generated consts on re-export.
    WorkspaceUpdateInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        businessType:
          type: string
          minLength: 1
          maxLength: 40
        country:
          type: string
          pattern: '^[A-Z]{2}$'
          description: ISO 3166-1 alpha-2 country code.
        timezone:
          type: string
          minLength: 1
          maxLength: 64
          description: IANA timezone name, e.g. "Asia/Aden".
    WorkspaceDeletionRequest:
      type: object
      properties:
        id:
          type: string
        status:
          type: string
          enum: [pending, completed, failed]
        requestedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
          nullable: true
      required: [id, status, requestedAt]
    # Deliberately loose: the export document grows sections over time and
    # clients treat it as a downloadable artifact, not a typed contract.
    WorkspaceExport:
      type: object
      additionalProperties: true
      properties:
        exportedAt:
          type: string
          format: date-time
      required: [exportedAt]
    WorkspaceDeletionRequestResponse:
      type: object
      properties:
        request:
          oneOf:
            - $ref: "#/components/schemas/WorkspaceDeletionRequest"
            - type: "null"
      required: [request]
    WorkspaceDeletionRequestCreatedResponse:
      type: object
      properties:
        request:
          $ref: "#/components/schemas/WorkspaceDeletionRequest"
      required: [request]
    KnownPostIdsInput:
      type: object
      properties:
        ids:
          type: array
          maxItems: 1000
          items:
            type: string
            maxLength: 150
      required: [ids]
    SubscriptionPlan:
      type: object
      properties:
        id:
          type: string
          enum: [free, starter, growth]
        name:
          type: string
        monthlyPriceUsd:
          type: integer
        limits:
          type: object
          properties:
            postsCreated:
              type: integer
            aiGenerations:
              type: integer
            channels:
              type: integer
          required: [postsCreated, aiGenerations, channels]
      required: [id, name, monthlyPriceUsd, limits]
    SubscriptionUsage:
      type: object
      properties:
        postsCreated:
          type: integer
        aiGenerations:
          type: integer
        channels:
          type: integer
      required: [postsCreated, aiGenerations, channels]
    SubscriptionOverview:
      type: object
      properties:
        planId:
          type: string
          enum: [free, starter, growth]
        planName:
          type: string
        status:
          type: string
          enum: [trialing, active, canceled, past_due, free]
        trialEndsAt:
          type: string
          format: date-time
          nullable: true
        paymentAvailable:
          type: boolean
        periodKey:
          type: string
        usage:
          $ref: "#/components/schemas/SubscriptionUsage"
        plans:
          type: array
          items:
            $ref: "#/components/schemas/SubscriptionPlan"
      required:
        - planId
        - planName
        - status
        - trialEndsAt
        - paymentAvailable
        - periodKey
        - usage
        - plans
    OnboardingProgressInput:
      type: object
      additionalProperties: false
      properties:
        action:
          type: string
          enum: [advance, back, skip]
        expectedStep:
          type: integer
          minimum: 0
          maximum: 3
          description: Apply the action only if the current step matches, for safe retries.
      required: [action]
    OnboardingStatus:
      type: object
      properties:
        started:
          type: boolean
        currentStep:
          type: integer
          minimum: 0
          maximum: 3
        completed:
          type: boolean
        socialAccountsCompleted:
          type: boolean
      required: [started, currentStep, completed, socialAccountsCompleted]
    SocialAccountStatus:
      type: object
      properties:
        accountId:
          type: string
        accountName:
          type: string
        connectedAt:
          type: string
          format: date-time
        connected:
          type: boolean
        connectionState:
          type: string
          enum:
            [connected, connecting, disconnected, failed, missing, unavailable]
        instanceName:
          type: string
        phoneNumber:
          type: string
        authorizationStatus:
          type: string
          enum: [ready, needs_reauthorization]
        authorizationReason:
          oneOf:
            - type: string
              enum:
                [
                  token_expired,
                  token_invalid,
                  permissions_unverified,
                  permissions_missing,
                ]
            - type: "null"
        missingPermissions:
          type: array
          items:
            type: string
        accessTokenExpiresAt:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
      required: [accountId, accountName, connectedAt]
    SocialConnectionsResponse:
      type: object
      properties:
        facebook:
          oneOf:
            - $ref: "#/components/schemas/SocialAccountStatus"
            - type: "null"
        instagram:
          oneOf:
            - $ref: "#/components/schemas/SocialAccountStatus"
            - type: "null"
        whatsapp:
          oneOf:
            - $ref: "#/components/schemas/SocialAccountStatus"
            - type: "null"
      required: [facebook, instagram]
    MetaConnectResponse:
      type: object
      properties:
        authorizationUrl:
          type: string
          format: uri
        callbackUri:
          type: string
          format: uri
      required: [authorizationUrl, callbackUri]
    MetaConnectInput:
      type: object
      properties:
        integration:
          type: string
          enum: [facebook, instagram]
          default: facebook
    MetaDisconnectResponse:
      type: object
      properties:
        disconnected:
          type: boolean
        alreadyDisconnected:
          type: boolean
        platform:
          type: string
          enum: [facebook, instagram]
        alsoDisconnectedInstagram:
          type: boolean
        externalRevocation:
          type: string
          enum: [unavailable]
      required: [disconnected]
    PostItem:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        body:
          type: string
        channels:
          type: array
          items:
            type: string
            enum: [instagram, facebook, whatsapp]
        status:
          type: string
          enum: [draft, review, approved, scheduled, published]
        metadata:
          type: object
          additionalProperties: true
        mediaUrls:
          type: array
          items:
            type: string
        mediaPreviewUrls:
          type: array
          items:
            type: string
        scheduledAt:
          type: string
          format: date-time
          nullable: true
          description: Due time for posts with status "scheduled"; null otherwise.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, title, body, channels, status, createdAt]
    CreatePostInput:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        body:
          type: string
        channels:
          type: array
          items:
            type: string
            enum: [instagram, facebook, whatsapp]
        status:
          type: string
          enum: [draft, review, approved, scheduled, published]
        metadata:
          type: object
          additionalProperties: true
        mediaUrls:
          type: array
          items:
            type: string
        scheduledAt:
          type: string
          format: date-time
          description: Required (future instant) when status is "scheduled".
      required: [title, body, channels, status]
    PostReportSummary:
      type: object
      properties:
        total:
          type: integer
        draft:
          type: integer
        review:
          type: integer
        scheduled:
          type: integer
        approved:
          type: integer
        publishing:
          type: integer
        published:
          type: integer
        failed:
          type: integer
        instagram:
          type: integer
        facebook:
          type: integer
        whatsapp:
          type: integer
      required:
        [
          total,
          draft,
          review,
          scheduled,
          approved,
          publishing,
          published,
          failed,
          instagram,
          facebook,
          whatsapp,
        ]
    UpdatePostInput:
      type: object
      properties:
        title:
          type: string
        body:
          type: string
        channels:
          type: array
          items:
            type: string
            enum: [instagram, facebook, whatsapp]
        status:
          type: string
          enum: [draft, review, approved, scheduled, published]
        scheduledAt:
          type: string
          format: date-time
          description: Future instant required to move a post into "scheduled"; null clears it.
          nullable: true
    PostDeleteResult:
      type: object
      properties:
        success:
          type: boolean
      required: [success]
    WhatsAppPairingCodeInput:
      type: object
      properties:
        phoneNumber:
          type: string
          pattern: '^\+?[1-9][0-9]{7,14}$'
        refreshCode:
          type: boolean
          description: Replace the pending Evolution instance using the same instance name before requesting a new pairing code.
      required: [phoneNumber]
    WhatsAppPairingCodeResponse:
      type: object
      description: At least one of pairingCode or qrCodeBase64 is returned.
      properties:
        instanceName:
          type: string
        phoneNumber:
          type: string
        pairingCode:
          type: string
          description: Optional phone-number pairing code.
        qrCodeBase64:
          type: string
          description: Optional QR image returned by Evolution for scanning when phone-number pairing is unavailable.
        state:
          type: string
          enum: [connecting]
      required: [instanceName, phoneNumber, state]
    WhatsAppConnectionStatus:
      type: object
      properties:
        state:
          type: string
          enum: [connecting, connected, disconnected, failed, unavailable]
      required: [state]
    WhatsAppAutoReplySettings:
      type: object
      properties:
        enabled:
          type: boolean
        language:
          type: string
          enum: [ar, match_customer]
        tone:
