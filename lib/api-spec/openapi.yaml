        externalUrl:
          type: [string, "null"]
        category:
          type: [string, "null"]
          description: Facebook.
        description:
          type: [string, "null"]
          description: Facebook and Instagram.
        lastSyncedAt:
          type: [string, "null"]
          format: date-time
        autoSyncEnabled:
          type: boolean
