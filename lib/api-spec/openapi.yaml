            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: The delivery transition is not allowed from the current status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /social/products:
    get:
      operationId: listCatalogProducts
      tags: [products]
      security:
        - bearerAuth: []
      summary: List the workspace's product catalog
      description: >-
        Returns every matching product, newest-updated first, each with the
        fields it is still missing and the publication history that actually
        went live. The list is not paginated: it is the merchant's whole catalog,
        which the product editor needs in memory to match against.
      parameters:
        - name: includeArchived
          in: query
          required: false
          description: Defaults to false, which excludes archived products
          schema:
            type: boolean
      responses:
        "200":
          description: The catalog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogProductListResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      operationId: createCatalogProduct
      tags: [products]
      security:
        - bearerAuth: []
      summary: Add a product to the catalog
      description: >-
        Creates the product, records an opening-balance movement if it starts with
        stock, and optionally links a Meta post that is already live. Sending
        `importedMetaPost` for a post that was published through MenaFlow reuses
        that post instead of creating a second one.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCatalogProductInput"
      responses:
        "201":
          description: The product as stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductWriteResponse"
        "400":
          description: Invalid product or imported-post data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: The SKU is already used in this workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: The imported post's image could not be stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /social/products/post-candidates:
    get:
      operationId: listProductCandidates
      tags: [products]
      security:
        - bearerAuth: []
      summary: Published posts that are not products yet
      description: >-
        The picker behind "import a post". A candidate is a post that actually
        went live on Facebook or Instagram and is not linked to any product, so
        the merchant can turn an existing listing into a catalog entry instead of
        retyping it. Newest first, at most 50. Posts with neither a title nor a
        body are dropped: there is nothing in them to extract.
      responses:
        "200":
          description: Posts available to import
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductCandidateListResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /social/products/extract-scanned-post:
    post:
      operationId: extractScannedPostProduct
      tags: [products]
      security:
        - bearerAuth: []
      summary: Read product fields out of a post without storing anything
      description: >-
        Runs the same extraction the WhatsApp queue uses, but synchronously and
        against one post, so the editor can pre-fill a product from a competitor's
        listing or from the merchant's own older post. Nothing is written.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScannedPostExtractionInput"
      responses:
        "200":
          description: What the post contains
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScannedPostExtraction"
        "400":
          description: No extractable text, or the post identifier is malformed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: >-
            The AI provider refused the request, was rate limited, timed out, or
            returned data that did not survive validation. The reason code is in
            the message.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: No AI key is configured on the server
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /social/products/import-post/{postId}:
    post:
      operationId: importPostAsProduct
      tags: [products]
      security:
        - bearerAuth: []
      summary: Turn a published post into a catalog product
      description: >-
        Creates a product from a post that is already live and links the two, so
        the catalog can show where the listing came from. Extraction failing
        degrades to an empty draft rather than failing the import: the merchant
        can still fill the fields in by hand.
      parameters:
        - name: postId
          in: path
          required: true
          description: A post in this workspace that is published on at least one channel
          schema:
            type: string
      responses:
        "201":
          description: Product created and linked to the post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductWriteResponse"
        "400":
          description: Invalid post identifier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: No such post, or it is not published
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: >-
            Already imported, or the post's text changed while it was being read —
            retry picks up the newer version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: AI extraction or media storage failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: No AI key is configured on the server
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /social/products/media:
    post:
      operationId: uploadProductMedia
      tags: [products]
      security:
        - bearerAuth: []
      summary: Upload an image or video to attach to a product
      description: >-
        The body is the file itself, not JSON. Two ways to say what it is: send
        the file's own content type, or send `application/octet-stream` and name
        the type in `mediaType` — the latter is what a generated client does,
        since it has to pin one content type and a wildcard is not a real one.
        The bytes are validated either way (an image is decoded, a video is
        checked for an `ftyp` box), so a wrong `mediaType` is refused rather than
        stored mislabelled. The returned media id is what `mediaUrls` holds, and
        the preview is a signed link the client can render without another
        request.
      parameters:
        - name: mediaType
          in: query
          required: false
          description: >-
            Required when the body is sent as `application/octet-stream`;
            otherwise it overrides the content type. One of `image/jpeg`,
            `image/png`, `image/webp`, `image/heic`, `image/heif`, `video/mp4`,
            `video/quicktime`.
          schema:
            type: string
            pattern: "^(image|video)/[a-z0-9.+-]+$"
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "201":
          description: Stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductMediaUploadResponse"
        "400":
          description: Unsupported type, over 20mb, or an unreadable image or video
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /social/products/public-media/{mediaId}:
    get:
      operationId: getProductPublicMedia
      tags: [products]
      summary: Serve a product's media over a signed link
      description: >-
        No bearer token: `mediaPreviews[].url` points here and is rendered
        directly by an image tag, so access is granted by the signature instead.
        The signature covers the media id, the expiry and the variant, which is
        why a thumbnail link cannot be swapped for the original. The content type
        follows the stored file — `image/webp` for thumbnails, `image/jpeg` for
        the Instagram variant, otherwise the original's.
      parameters:
        - name: mediaId
          in: path
          required: true
          schema:
            type: string
        - name: expires
          in: query
          required: true
          schema:
            type: string
        - name: signature
          in: query
          required: true
          schema:
            type: string
        - name: variant
          in: query
          required: false
          description: >-
            `thumbnail` and `instagram-jpeg` are only valid for images; anything
            else is served as `original`.
          schema:
            type: string
            enum: [original, thumbnail, instagram-jpeg]
            default: original
      responses:
        "200":
          description: The media bytes
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "403":
          description: Bad signature, expired link, or a thumbnail of a video
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: The media id is well formed but no file is stored under it
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /social/products/{id}:
    put:
      operationId: updateCatalogProduct
      tags: [products]
      security:
        - bearerAuth: []
      summary: Replace a product's editable fields
      description: >-
        A full replace, not a patch: omitted optional fields go back to their
        defaults, which is why `ProductInput` marks the merchant's fields
        required. Stock is checked against reservations before anything is
        written, and a stock change is recorded as an inventory movement.
      parameters:
        - $ref: "#/components/parameters/ProductId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "200":
          description: The product as stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductWriteResponse"
        "400":
          description: Invalid product data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: No such product in this workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: The SKU is taken, or stock would drop below the reserved quantity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /social/products/{id}/inventory-movements:
    get:
      operationId: listInventoryMovements
      tags: [products]
      security:
        - bearerAuth: []
      summary: The newest stock movements of one product
      description: >-
        Opening balances, manual adjustments, and the reservations orders place
        and release. Newest first, at most 20 — a receipt to explain the current
        stock, not a ledger export.
      parameters:
        - $ref: "#/components/parameters/ProductId"
      responses:
        "200":
          description: Movements
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryMovementListResponse"
        "400":
          description: Invalid product identifier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: No such product in this workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /social/products/{id}/changes:
    get:
      operationId: listProductChanges
      tags: [products]
      security:
        - bearerAuth: []
      summary: Who changed what on a product, and from where
      description: >-
        The audit trail. Each record carries the source — a manual edit, an
        accepted extraction proposal, an order, or publication — which is what
        lets the merchant tell "I changed this price" from "the customer's
        message did". Newest first, at most 200.
      parameters:
        - $ref: "#/components/parameters/ProductId"
      responses:
        "200":
          description: Change records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductChangeListResponse"
        "400":
          description: Invalid product identifier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: No such product in this workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /social/products/change-proposals:
    get:
      operationId: listProductChangeProposals
      tags: [products]
      security:
        - bearerAuth: []
      summary: Updates the extraction queue proposed for existing products
      description: >-
        Each proposal is a diff against a product that already exists, with the
        message evidence behind it, so the merchant can accept or reject a price
        change without retyping it. Newest first, at most 100.
      parameters:
        - name: status
          in: query
          required: false
          description: Omit it for every status. An unknown value is ignored rather than rejected.
          schema:
            type: string
            enum: [proposed, accepted, rejected, expired]
      responses:
        "200":
          description: Proposals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductChangeProposalListResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /social/products/change-proposals/{proposalId}/decide:
    post:
      operationId: decideProductChangeProposal
      tags: [products]
      security:
        - bearerAuth: []
      summary: Accept or reject a proposed product update
      description: >-
        Accepting writes the diff onto the product and records each field as a
        change; rejecting only closes the proposal. Either way the suggestion that
        produced it leaves the queue, and a proposal can only be decided once.
      parameters:
        - name: proposalId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductChangeDecisionInput"
      responses:
        "200":
          description: The decision as recorded, with the fields it touched
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductChangeDecisionResponse"
        "400":
          description: Invalid decision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: No such proposal in this workspace, or it was already decided
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /social/products/whatsapp-extractions/{suggestionId}/restore:
    post:
      operationId: restoreProductExtractionSuggestion
      tags: [products]
      security:
        - bearerAuth: []
      summary: Return a dismissed suggestion to the review queue
      description: >-
        Undoes a dismissal. Only a `dismissed` suggestion can be restored: once a
        suggestion has become a draft it is past this, and the product is edited
        instead.
      parameters:
        - $ref: "#/components/parameters/ProductSuggestionId"
      responses:
        "200":
          description: Back in the review queue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductExtractionRestoreResponse"
        "400":
          description: Invalid suggestion identifier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: No such suggestion in this workspace, or it was not dismissed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /social/products/whatsapp-extractions/{suggestionId}/reprocess:
    post:
      operationId: reprocessProductExtraction
      tags: [products]
      security:
        - bearerAuth: []
      summary: Queue a suggestion's source message for extraction again
      description: >-
        Bumps the ruleset version and re-runs the extractor over the original
        message, for when the rules improve or the first pass clearly misread it.
        The current suggestion stays in place until the new pass replaces it.
      parameters:
        - $ref: "#/components/parameters/ProductSuggestionId"
      responses:
        "202":
          description: Re-extraction queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductExtractionReprocessResponse"
        "400":
          description: Invalid suggestion identifier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: No such suggestion in this workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
          description: The suggestion has no source message left to re-read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /social/products/whatsapp-extractions/{suggestionId}/propose-update:
    post:
      operationId: proposeProductUpdate
      tags: [products]
      security:
        - bearerAuth: []
      summary: Turn a suggestion into a diff against an existing product
      description: >-
        For a message that describes a product already in the catalog — a new
        price, a corrected description. Nothing is applied yet: this records the
        proposal for the merchant to accept or reject. A suggestion with no
        matching product cannot propose anything.
      parameters:
        - $ref: "#/components/parameters/ProductSuggestionId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductUpdateProposalInput"
      responses:
        "201":
          description: Proposal recorded, with the diff it would apply
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductUpdateProposalResponse"
        "400":
          description: Invalid suggestion identifier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: No such suggestion or product in this workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
          description: Nothing to match the suggestion against, or the diff came out empty
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /social/products/extraction-metrics:
    get:
      operationId: getProductExtractionMetrics
      tags: [products]
      security:
        - bearerAuth: []
      summary: Extraction counters for the last seven days
      description: >-
        How many messages were read, how many became products, and how many
        proposed updates were accepted. The window is fixed at seven days: this is
        a health glance for the review screen, not reporting.
      responses:
        "200":
          description: Counters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductExtractionMetrics"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /social/products/publish-jobs:
    get:
      operationId: getProductPublicationJobs
      tags: [products]
      security:
        - bearerAuth: []
      summary: Poll the jobs a publish request created
      description: >-
        Same shape as the publish response, so a screen can poll without branching.
        The request key is what ties the jobs to the click that started them.
      parameters:
        - name: requestKey
          in: query
          required: true
          description: The key the publish request was sent with
          schema:
            type: string
            pattern: "^[A-Za-z0-9._:-]{8,128}$"
      responses:
        "200":
          description: Jobs and their counters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductPublicationSnapshot"
        "400":
          description: Invalid request key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /social/products/publish-jobs/retry:
    post:
      operationId: retryProductPublicationJobs
      tags: [products]
      security:
        - bearerAuth: []
      summary: Re-queue failed publication jobs
      description: >-
        Only jobs that actually failed are retried; queued and published ones are
        left alone. The response covers every job sharing a request key with the
        ones retried, so the counters still describe the whole batch.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductPublicationRetryInput"
      responses:
        "202":
          description: Re-queued, with the batch's current state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductPublicationRetryResponse"
        "400":
          description: No job ids, or more than 50
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: None of the selected jobs are failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /social/whatsapp/sync-status:
    get:
      operationId: getWhatsAppSyncStatus
      tags: [social]
      security:
        - bearerAuth: []
      summary: Per-group sync state and the workspace's sync switches
      description: >-
        Selected groups are listed even before their first sync run, with
        status "idle" and zero counters, so the client can offer "sync now" on a
        fresh workspace instead of disabling it forever.
      responses:
        "200":
          description: Sync status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhatsAppSyncStatusResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: The workspace has no WhatsApp connection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /social/whatsapp/sync-settings:
    put:
      operationId: updateWhatsAppSyncSettings
      tags: [social]
      security:
        - bearerAuth: []
      summary: Update which WhatsApp content types are synced automatically
      description: >-
        Partial update: only the keys present are changed. Any unknown key is
        rejected rather than ignored.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WhatsAppSyncSettings"
      responses:
        "200":
          description: The resulting settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhatsAppSyncSettings"
        "400":
          description: Empty body, an unknown key, or a non-boolean value
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: The workspace has no WhatsApp connection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /social/whatsapp/sync-now:
    post:
      operationId: triggerWhatsAppSync
      tags: [social]
      security:
        - bearerAuth: []
      summary: Start a sync of the selected WhatsApp groups
      description: >-
        202 means the work is queued; poll sync-status for progress. A 200 with a
        status other than "started" explains why nothing was queued.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                includeHistory:
                  type: boolean
                  description: Defaults to true
                historyLimit:
                  type: integer
                  minimum: 1
                  description: Only read when includeHistory is true
      responses:
        "200":
          description: Nothing to do, or a sync is already running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhatsAppSyncTriggerResponse"
        "202":
          description: Sync queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhatsAppSyncTriggerResponse"
        "400":
          description: historyLimit is out of range
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: The workspace has no WhatsApp connection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: A selected group has no resolvable provider identity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /social/whatsapp/groups/{groupJid}/messages:
    get:
      operationId: listWhatsAppGroupMessages
      tags: [social]
      security:
        - bearerAuth: []
      summary: Page through a WhatsApp group's stored messages
      parameters:
        - name: groupJid
          in: path
          required: true
          description: The group's provider JID
          schema:
            type: string
            minLength: 1
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [asc, desc]
      responses:
        "200":
          description: A page of messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhatsAppGroupMessagesResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /social/meta-inbox:
    get:
      operationId: listMetaInbox
      tags: [social]
      security:
        - bearerAuth: []
      summary: The Facebook and Instagram inbox
      description: >-
        Messages and comments from both platforms in one feed, newest first, at
        most 100 per page. The response opens with the webhook's own state, so a
        screen can say "Meta has not called us since Tuesday" instead of showing
        an empty inbox with no explanation.
      parameters:
        - name: platform
          in: query
          required: false
          schema:
            type: string
            enum: [facebook, instagram]
        - name: kind
          in: query
          required: false
          schema:
            type: string
            enum: [message, comment]
        - name: personId
          in: query
          required: false
          description: >-
            One conversation. Matches the actor id where there is one, and falls
            back to the conversation id for messages or the external id for
            comments, so a thread with no actor still opens.
          schema:
            type: string
        - name: cursor
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: A page of the inbox, with the webhook state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetaInboxResponse"
        "400":
          description: An unknown filter, or a page size outside 1-100
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /social/meta-inbox/items/{id}/reply:
    post:
      operationId: sendMetaInboxReply
      tags: [social]
      security:
        - bearerAuth: []
      summary: Reply to a message or comment as the page
      description: >-
        Sends through the Graph API and records the reply on the item. A failure
        the server cannot classify comes back as `META_SEND_RESULT_UNKNOWN` rather
        than a plain error: the reply may or may not have landed, so the app must
        not retry it blindly.
      parameters:
        - $ref: "#/components/parameters/MetaInboxItemId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MetaInboxReplyInput"
      responses:
        "200":
          description: Reply sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetaInboxReplyResponse"
        "400":
          description: Invalid item id, or a reply outside 1-2000 characters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: No such item in this workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: >-
            Meta is not connected, the item is not a kind that can be replied to,
            or it has already been replied to.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
          description: Meta refused the reply, with a reason the merchant can act on
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: >-
            The send was attempted but its outcome is unknown (code
            `META_SEND_RESULT_UNKNOWN`). Confirm with the thread before retrying.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /social/meta-inbox/items/{id}/auto-reply:
    post:
      operationId: retryMetaInboxAutoReply
      tags: [social]
      security:
        - bearerAuth: []
      summary: Re-queue the automatic reply for one item
      description: >-
        For an item whose automatic reply failed or was skipped. Does nothing once
        a reply exists — manual and automatic replies share one slot, so
        re-queuing would send a second answer to the same customer.
      parameters:
        - $ref: "#/components/parameters/MetaInboxItemId"
      responses:
        "200":
          description: Re-queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetaInboxAutoReplyResponse"
        "400":
          description: Invalid item identifier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: No such item in this workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Already replied to, or automatic replies are off for this platform
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /social/meta-inbox/items/{id}/retry-confirmation:
    post:
      operationId: confirmMetaInboxReplyNotSent
      tags: [social]
      security:
        - bearerAuth: []
      summary: Record that a reply with an unknown outcome never arrived
      description: >-
        Clears an unresolved send attempt so the merchant can try again. Only an
        item whose reply status is still unknown can be cleared, and only once.
      parameters:
        - $ref: "#/components/parameters/MetaInboxItemId"
      responses:
        "200":
          description: Cleared
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetaInboxRetryConfirmationResponse"
        "400":
          description: Invalid item identifier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Nothing unresolved to clear, or the item was already replied to
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /social/meta-auto-replies/historical-comments:
    get:
      operationId: getMetaAutoReplyHistoricalPosts
      tags: [social]
      security:
        - bearerAuth: []
      summary: Published posts that could receive automatic comment replies
      description: >-
        Per platform, whether the feature is ready and why not if it is not, plus
        the posts with comments old enough to answer. `posts` is empty when
        `ready` is false, so the picker can show the reason instead of a dead list.
      responses:
        "200":
          description: Candidate posts per platform
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetaAutoReplyHistoricalPostsResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      operationId: queueMetaAutoReplyHistoricalComments
      tags: [social]
      security:
        - bearerAuth: []
      summary: Queue every eligible comment on the selected posts for an automatic reply
      description: >-
        Either `allEligible` or an explicit `postIds` list, never both. Replies are
        queued in batches, so the response reports how many were queued and how
        many batches that became.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MetaAutoReplyHistoricalQueueInput"
      responses:
        "202":
          description: Comments queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetaAutoReplyHistoricalQueueResponse"
        "400":
          description: Invalid platform, an empty or oversized post list, or duplicate post ids
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Comment replies are off for that platform, or Meta is not ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /social/meta-auto-replies/test:
    post:
      operationId: testMetaAutoReply
      tags: [social]
      security:
        - bearerAuth: []
      summary: Draft a reply to a sample message, without sending it
      description: >-
        Runs the same composition the worker uses, against settings the merchant
        has not saved yet, so the settings screen can show what a reply would look
        like. Nothing is sent and nothing is stored.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MetaAutoReplyTestInput"
      responses:
        "200":
          description: The drafted reply
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetaAutoReplyTestResponse"
        "400":
          description: The supplied settings are not valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: The AI provider failed to draft a reply
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: No AI key is configured on the server
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /social/whatsapp/media/{mediaId}/url:
    get:
      operationId: getWhatsAppMediaUrl
      tags: [social]
      security:
        - bearerAuth: []
      summary: Mint a fresh signed URL for a stored WhatsApp media file
      description: >-
        Signed URLs expire; this re-issues one without re-downloading. The file
        itself is served by the public signed endpoint.
      parameters:
        - name: mediaId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
        - name: variant
          in: query
          required: false
          schema:
            type: string
            enum: [original, thumbnail]
      responses:
        "200":
          description: A signed URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhatsAppMediaUrlResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Unknown media id, or the stored file is missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /social/whatsapp/media/{mediaId}:
    get:
      operationId: getWhatsAppMedia
      tags: [social]
      security:
        - bearerAuth: []
      summary: Serve a stored WhatsApp attachment to a signed-in member
      description: >-
        The authenticated counterpart of the public signed link, for callers that
        already hold a session — the app uses it where it has a token and no
        signature to hand. Returns the original file; thumbnails come from the
        public endpoint with `variant=thumbnail`.
      parameters:
        - name: mediaId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: The stored bytes
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: No such attachment in this workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: The stored file could not be read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /social/whatsapp/public-media/{mediaId}:
    get:
      operationId: getWhatsAppPublicMedia
      tags: [social]
      summary: Serve a WhatsApp attachment over a signed link
      description: >-
        No bearer token: message media previews point here and are rendered
        directly by an image tag, so access is granted by the signature instead.
        The signature covers the media id, the expiry and the variant, which is
        why a thumbnail link cannot be swapped for the original.
      parameters:
        - name: mediaId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
        - name: expires
          in: query
          required: true
          schema:
            type: string
        - name: signature
          in: query
          required: true
          schema:
            type: string
        - name: variant
          in: query
          required: false
          description: >-
            `instagram-jpeg` is a re-encode for Meta and is only valid for
            images; anything else is served as the original.
          schema:
            type: string
            enum: [original, thumbnail, instagram-jpeg]
            default: original
      responses:
        "200":
          description: The media bytes
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "400":
          description: The Instagram JPEG variant was asked of a video
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Bad signature, or the link has expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Unknown media id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: The stored file could not be read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /social/whatsapp/direct-conversations:
    get:
      operationId: listWhatsAppDirectConversations
      tags: [social]
      security:
        - bearerAuth: []
      summary: The workspace's one-to-one WhatsApp conversations
      description: >-
        One row per customer number, newest message first, at most 100. Only
        conversations with a message still inside the retention window appear,
        and every row carries the preview and the last delivery status so the list
        can be rendered without a second request per conversation.
      responses:
        "200":
          description: Conversations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhatsAppDirectConversationListResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: The workspace has no WhatsApp connection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /social/whatsapp/direct-messages:
    get:
      operationId: listWhatsAppDirectMessages
      tags: [social]
      security:
        - bearerAuth: []
      summary: One conversation's messages, newest first
      description: >-
        At most 100 per page. `nextCursor` is `null` once the conversation is
        exhausted. Duplicates of the same provider message are collapsed, and
        messages whose encrypted content can no longer be read are skipped rather
        than failing the page.
      parameters:
        - name: remoteJid
          in: query
          required: true
          description: The conversation to read
          schema:
            type: string
            minLength: 1
        - name: beforeTimestamp
          in: query
          required: false
          description: Where the previous page ended. Send together with `beforeId`.
          schema:
            type: string
            format: date-time
        - name: beforeId
          in: query
          required: false
          description: Where the previous page ended. Send together with `beforeTimestamp`.
          schema:
            type: string
            maxLength: 200
      responses:
        "200":
          description: A page of messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhatsAppDirectMessageListResponse"
        "400":
          description: Invalid conversation id, or a cursor missing half of its pair
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: The workspace has no WhatsApp connection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /social/whatsapp/direct-messages/reply:
    post:
      operationId: sendWhatsAppDirectReply
      tags: [social]
      security:
        - bearerAuth: []
      summary: Reply to a customer in a one-to-one WhatsApp conversation
      description: >-
        Idempotent on `clientRequestId`: replaying the same request returns the
        message it created the first time, with `duplicate: true`, instead of
        sending a second reply. A request id reused with different text is
        refused rather than silently sending the new text.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WhatsAppDirectReplyInput"
      responses:
        "201":
          description: Reply queued and handed to the provider
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhatsAppDirectReplyResponse"
        "400":
          description: Missing or malformed conversation id, text or request id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: No WhatsApp connection, or no inbound conversation with that number
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: >-
            The conversation id has no phone-number form to reply to, or the
            request id was already used for different content.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: >-
            The provider accepted the request but its outcome is unknown. The
            message is stored as `unknown` and returned in the body, so the app
            can offer to confirm it was not sent instead of retrying blindly.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhatsAppDirectReplyUncertain"
  /social/whatsapp/direct-messages/{id}/confirm-not-sent:
    post:
      operationId: confirmWhatsAppDirectReplyNotSent
      tags: [social]
      security:
        - bearerAuth: []
      summary: Record that a reply with an unknown outcome never arrived
      description: >-
        Closes out a message the provider never confirmed. Only an outbound
        message still in `unknown` can be confirmed, and only once — this is what
        stops a retry from sending the same reply twice.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 200
      responses:
        "200":
          description: The message as now recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhatsAppDirectMessageEnvelope"
        "400":
          description: Invalid message identifier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: The message is not awaiting confirmation, or was already resolved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /social/whatsapp/content-associations:
    post:
      operationId: decideWhatsAppContentAssociation
      tags: [social]
      security:
        - bearerAuth: []
      summary: Record whether two messages are one piece of content
      description: >-
        When a customer sends a photo and its caption as two messages, the
        extractor cannot know they belong together. The merchant decides here.
        Accepting links them into one content bundle; both messages are then
        re-queued so the product is extracted from the pair.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WhatsAppContentAssociationInput"
      responses:
        "200":
          description: Decision recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhatsAppContentAssociationDecision"
        "400":
          description: Missing ids, the same id twice, or an unknown decision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: The two messages are not in the same group and workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: >-
            A different decision was already saved for this pair, one of the
            messages is gone, or the group is not selected for syncing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: The decision could not be saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /plans:
    get:
      operationId: listPlans
      tags: [plans]
      summary: The subscription plans and the trial on offer
      description: >-
        Public and cacheable for five minutes — it is the same for everyone and
        changes only when the pricing does. `paymentAvailable` says whether this
        deployment can take a payment at all, so the app can hide an upgrade
        button it could not complete.
      responses:
        "200":
          description: Plans, the trial, and whether payment is possible
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlansResponse"
  /readyz:
    get:
      operationId: getReadiness
      tags: [health]
      summary: Whether the server can serve, and which migrations are missing
      description: >-
        Distinct from `/healthz`: this one answers 503 when the database is
        unreachable or when a column the code needs is absent, which is the state
        a half-applied migration leaves behind. `missingSchema` names the exact
        columns so the operator knows what to run.
      responses:
        "200":
          description: Database reachable and the expected schema present
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
        "503":
          description: Unready, with the missing columns named when that is the cause
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
  /posts/events:
    get:
      operationId: subscribeToPostEvents
      tags: [posts]
      security:
        - bearerAuth: []
      summary: A server-sent-events stream that says when posts change
      description: >-
        Emits `posts_changed` whenever a post in this workspace is created,
        edited or published, so the app can refetch instead of polling. Heartbeat
        comments every 25 seconds keep proxies from closing an idle connection.
      responses:
        "200":
          description: The stream
          content:
            text/event-stream:
              schema:
                type: string
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /posts/from-message:
    post:
      operationId: createPostFromWhatsAppMessage
      tags: [posts]
      security:
        - bearerAuth: []
      summary: Turn one WhatsApp message into a post
      description: >-
        Runs the same intake the backlog worker uses, but for a single message the
        merchant picked. `201` when a post was created, `200` when the message
        already had one. Automatic publishing is deliberately off here: the
        merchant is reviewing this message by hand.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePostFromMessageInput"
      responses:
        "200":
          description: The message already had a post; here it is
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostItem"
        "201":
          description: Post created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostItem"
        "400":
          description: No message id in the body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
          description: The message holds nothing that can become a post, with the reason
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: The post could not be created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /posts/auto-publish-settings:
    get:
      operationId: getAutoPublishSettings
      tags: [posts]
      security:
        - bearerAuth: []
      summary: Whether approved posts are published without a click, and where
      responses:
        "200":
          description: The current settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutoPublishSettings"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: The settings could not be read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    put:
      operationId: updateAutoPublishSettings
      tags: [posts]
      security:
        - bearerAuth: []
      summary: Turn automatic publishing on or off, and choose the channels
      description: >-
        Turning it on publishes the posts already sitting in `approved` as well,
        and reports how that went in `initialPublish` — otherwise the merchant
        would enable the setting and watch nothing happen.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AutoPublishSettingsInput"
      responses:
        "200":
          description: The settings as saved, plus the result of publishing the backlog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutoPublishSettings"
        "400":
          description: >-
            `enabled` is not a boolean, or no channel was chosen
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: The settings could not be saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /posts/process-whatsapp-backlog:
    post:
      operationId: processWhatsAppBacklog
      tags: [posts]
      security:
        - bearerAuth: []
      summary: Sweep unprocessed WhatsApp messages for posts
      description: >-
        The manual counterpart of the scheduled sweep. Reports what it found in
        each bucket, so the merchant can tell "nothing new" from "everything was
        skipped" — the two look identical without the counts.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProcessWhatsAppBacklogInput"
      responses:
        "200":
          description: What the sweep did
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcessWhatsAppBacklogResult"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: The sweep failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /posts/{id}/publish:
    post:
      operationId: publishPost
      tags: [posts]
      security:
        - bearerAuth: []
      summary: Publish a post to Facebook and Instagram
      description: >-
        Claims the post, publishes to each channel in turn and records every
        outcome as it lands, so a failure part-way leaves a post with one channel
        live and the result saying which. The response is `400` when any channel
        failed, but still carries `results` and `post` — read them, do not show a
        generic error over a half-successful publish.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublishPostInput"
      responses:
        "200":
          description: Every requested channel published
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostPublishResponse"
        "400":
          description: >-
            Invalid body, id or channel; or a channel failed — `results` says
            which, and `post` is the post as recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostPublishResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: No such post in this workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Another publish attempt for this post is already running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
          description: The post is not ready to publish, with the reason
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /posts/{id}/verify-facebook:
    post:
      operationId: verifyFacebookPost
      tags: [posts]
      security:
        - bearerAuth: []
      summary: Ask Facebook whether a post it never confirmed actually went live
      description: >-
        Closes out a publish whose result the server never learned. Three
        outcomes, and the difference matters: `found` means it is live and the
        post is marked published, `not-found` means it is not and the post is
        marked failed, `unavailable` means Facebook would not say — the post must
        stay unresolved rather than be retried into a duplicate.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: What Facebook said, and the post as now recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FacebookPostVerification"
        "400":
          description: Invalid post identifier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: No such post in this workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: The post's state changed while it was being verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Facebook could not be reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    OrderId:
      name: id
      in: path
      required: true
      description: Identifier of the order
      schema:
        type: string
        minLength: 1
        maxLength: 200
    MetaInboxItemId:
      name: id
      in: path
      required: true
      description: Identifier of an inbox item — a message or a comment
      schema:
        type: string
        minLength: 1
    ProductId:
      name: id
      in: path
      required: true
      description: Identifier of the product
      schema:
        type: string
    ProductSuggestionId:
      name: suggestionId
      in: path
      required: true
      description: Identifier of the extraction suggestion
      schema:
        type: string
        pattern: "^[0-9a-fA-F-]{36}$"
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    AiContentInput:
      type: object
      additionalProperties: false
      properties:
        idea:
          type: string
          minLength: 3
          maxLength: 1200
        businessContext:
          type: string
          maxLength: 500
        provider:
          type: string
          enum: [gemini, openai]
        tone:
          type: string
          enum: [professional, friendly, promotional, concise]
        channel:
          type: string
          enum: [instagram, facebook, whatsapp]
      required: [idea, provider, tone, channel]
    AiContentResponse:
      type: object
      properties:
        content:
          type: string
        provider:
          type: string
          enum: [gemini, openai]
        model:
          type: string
      required: [content, provider, model]
    ApiError:
      type: object
      properties:
        error:
          type: string
        code:
          type: string
        requestId:
          type: string
      required: [error]
    OrderStatus:
      type: string
      enum: [draft, confirmed, preparing, shipped, completed, cancelled]
    DeliveryStatus:
      type: string
      enum: [pending, ready, picked_up, in_transit, delivered, failed, returned]
    CollectionStatus:
      type: string
      enum: [not_collected, collected, remitted]
    MetaConfirmationStatus:
      type: string
      enum: [not_required, queued, processing, sending, sent, manual_followup, failed, unknown]
    WhatsAppConfirmationStatus:
      type: string
      enum: [not_required, queued, processing, sending, sent, failed, unknown, manual_followup]
    OrderSummary:
      type: object
      description: Order counts for the workspace, keyed by status
      required:
        [draft, confirmed, preparing, shipped, completed, cancelled, total, metaDrafts, whatsappDrafts]
      properties:
        draft:
          type: integer
          minimum: 0
        confirmed:
          type: integer
          minimum: 0
        preparing:
          type: integer
          minimum: 0
        shipped:
          type: integer
          minimum: 0
        completed:
          type: integer
          minimum: 0
        cancelled:
          type: integer
          minimum: 0
        total:
          type: integer
          minimum: 0
        metaDrafts:
          type: integer
          minimum: 0
        whatsappDrafts:
          type: integer
          minimum: 0
    OrderItem:
      type: object
      required: [id, productId, productName, productSku, quantity, unitPrice, lineTotal]
      properties:
        id:
          type: string
        productId:
          type: string
          nullable: true
        productName:
          type: string
        productSku:
          type: string
          nullable: true
        quantity:
          type: integer
          minimum: 1
        unitPrice:
          type: string
          description: Decimal as a string, to keep exact money arithmetic on the client
        lineTotal:
          type: string
    OrderEvent:
      type: object
      required: [id, fromStatus, toStatus, createdAt]
      properties:
        id:
          type: string
        fromStatus:
          # `null` is the creation event, which has no previous status. Expressed
          # as anyOf rather than `$ref` + `nullable`, which OpenAPI 3.1 ignores.
          anyOf:
            - $ref: "#/components/schemas/OrderStatus"
            - type: "null"
        toStatus:
          $ref: "#/components/schemas/OrderStatus"
        createdAt:
          type: string
          format: date-time
    OrderDeliveryEvent:
      type: object
      required: [id, toStatus, createdAt]
      properties:
        id:
          type: string
        toStatus:
          $ref: "#/components/schemas/DeliveryStatus"
        createdAt:
          type: string
          format: date-time
    Order:
      type: object
      required:
        - id
        - orderNumber
        - customerName
        - customerPhone
        - deliveryAddress
        - notes
        - sourceMetaInboxItemId
        - sourcePlatform
        - sourceConversationId
        - sourceWhatsAppInstanceName
        - metaConfirmationStatus
        - metaConfirmationError
        - metaConfirmationSentAt
        - whatsappConfirmationStatus
        - whatsappConfirmationError
        - whatsappConfirmationSentAt
        - status
        - deliveryStatus
        - deliveryProvider
        - trackingNumber
        - deliveryFee
        - collectionStatus
        - collectedAmount
        - deliveredAt
        - currency
        - total
        - createdAt
        - updatedAt
        - items
        - events
        - deliveryEvents
      properties:
        id:
          type: string
        orderNumber:
          type: string
        customerName:
          type: string
        customerPhone:
          type: string
          nullable: true
        deliveryAddress:
          type: string
          nullable: true
        notes:
          type: string
        sourceMetaInboxItemId:
          type: string
          nullable: true
        sourcePlatform:
          type: string
          enum: [facebook, instagram, whatsapp]
          nullable: true
        sourceConversationId:
          type: string
          nullable: true
        sourceWhatsAppInstanceName:
          type: string
          nullable: true
        metaConfirmationStatus:
          $ref: "#/components/schemas/MetaConfirmationStatus"
        metaConfirmationError:
          type: string
          nullable: true
        metaConfirmationSentAt:
          type: string
          format: date-time
          nullable: true
        whatsappConfirmationStatus:
          $ref: "#/components/schemas/WhatsAppConfirmationStatus"
        whatsappConfirmationError:
          type: string
          nullable: true
        whatsappConfirmationSentAt:
          type: string
          format: date-time
          nullable: true
        status:
          $ref: "#/components/schemas/OrderStatus"
        deliveryStatus:
          $ref: "#/components/schemas/DeliveryStatus"
        deliveryProvider:
          type: string
          nullable: true
        trackingNumber:
          type: string
          nullable: true
        deliveryFee:
          type: string
          description: Decimal as a string
        collectionStatus:
          $ref: "#/components/schemas/CollectionStatus"
        collectedAmount:
          type: string
          description: Decimal as a string
        deliveredAt:
          type: string
          format: date-time
          nullable: true
        currency:
          type: string
        total:
          type: string
          description: Decimal as a string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"
        events:
          type: array
          items:
            $ref: "#/components/schemas/OrderEvent"
        deliveryEvents:
          type: array
          items:
            $ref: "#/components/schemas/OrderDeliveryEvent"
    OrderListResponse:
      type: object
      required: [orders, nextCursor]
      properties:
        orders:
          type: array
          items:
            $ref: "#/components/schemas/Order"
        nextCursor:
          type: string
          nullable: true
    OrderResponse:
      type: object
      required: [order]
      properties:
        order:
          $ref: "#/components/schemas/Order"
    CreateOrderRequest:
      type: object
      required: [clientRequestId, customerName, items]
      properties:
        clientRequestId:
          type: string
          minLength: 1
          maxLength: 200
          description: Idempotency key chosen by the client
        customerName:
          type: string
          minLength: 1
          maxLength: 200
        customerPhone:
          type: string
          maxLength: 40
        deliveryAddress:
          type: string
          maxLength: 1000
        notes:
          type: string
          maxLength: 2000
        sourceMetaInboxItemId:
          type: string
          maxLength: 200
          description: Set when the order was captured from an inbox conversation
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [productId, quantity]
            properties:
              productId:
                type: string
                minLength: 1
                maxLength: 200
              quantity:
                type: integer
                minimum: 1
    OrderStatusUpdateRequest:
      type: object
      required: [status]
      properties:
        status:
          $ref: "#/components/schemas/OrderStatus"
    OrderDeliveryUpdateRequest:
      type: object
      minProperties: 1
      properties:
        deliveryStatus:
          $ref: "#/components/schemas/DeliveryStatus"
        deliveryProvider:
          type: string
          maxLength: 200
          nullable: true
        trackingNumber:
          type: string
          maxLength: 200
          nullable: true
        deliveryFee:
          type: string
          description: Decimal as a string
        collectionStatus:
          $ref: "#/components/schemas/CollectionStatus"
        collectedAmount:
          type: string
          description: Decimal as a string
    WhatsAppSyncSettings:
      type: object
      description: Which WhatsApp content types are synced automatically
      properties:
        autoSyncEnabled:
          type: boolean
        syncMessagesEnabled:
          type: boolean
        syncImagesEnabled:
          type: boolean
        syncVideosEnabled:
          type: boolean
    WhatsAppSyncStatusGroup:
      type: object
      description: One selected group's sync state
      required:
        - groupJid
        - groupName
        - status
        - savedMessageCount
        - importedCount
        - skippedCount
        - failedCount
        - lastSyncedAt
        - lastError
        - startedAt
        - completedAt
      properties:
        groupJid:
          type: string
        groupName:
          type: string
        status:
          type: string
          description: >-
            Provider-backed state, e.g. "idle" for a selected group that has
            never been synced, "running", "completed" or "failed". Open-ended
            because the value is persisted, not enumerated by this contract.
        savedMessageCount:
          type: integer
          minimum: 0
          description: >-
            Messages currently stored for this group, counted directly rather
            than read from the sync state, so webhook-only traffic surfaces.
        importedCount:
          type: integer
          minimum: 0
        skippedCount:
          type: integer
          minimum: 0
        failedCount:
          type: integer
          minimum: 0
        lastSyncedAt:
          type: string
          format: date-time
          nullable: true
        lastError:
          type: string
          nullable: true
        startedAt:
          type: string
          format: date-time
          nullable: true
        completedAt:
          type: string
          format: date-time
          nullable: true
    WhatsAppSyncStatusResponse:
      type: object
      required:
        - autoSyncEnabled
        - syncMessagesEnabled
        - syncImagesEnabled
        - syncVideosEnabled
        - groups
      properties:
        autoSyncEnabled:
          type: boolean
        syncMessagesEnabled:
          type: boolean
        syncImagesEnabled:
          type: boolean
        syncVideosEnabled:
          type: boolean
        groups:
          type: array
          items:
            $ref: "#/components/schemas/WhatsAppSyncStatusGroup"
    WhatsAppSyncTriggerStatus:
      type: string
      description: >-
        "started" means queued (202). Every other value is a 200 that explains
        why nothing was queued.
      enum:
        - started
        - already_running
        - no_selected_groups
        - no_linked_announcement_groups
        - no_sync_options
    WhatsAppSyncTriggerResponse:
      type: object
      required: [status, groups]
      properties:
        status:
          $ref: "#/components/schemas/WhatsAppSyncTriggerStatus"
        includeHistory:
          type: boolean
          description: Only present when a sync was queued
        historyLimit:
          type: integer
          minimum: 1
          description: Only present when a sync was queued with history
        groups:
          type: array
          description: Empty unless a sync was queued or is already running
          items:
            type: object
            required: [groupJid, groupName]
            properties:
              groupJid:
                type: string
              groupName:
                type: string
    WhatsAppMessageMedia:
      type: object
      required: [id, mediaType]
      properties:
        id:
          type: string
        mediaIndex:
          type: integer
          minimum: 0
        mediaType:
          type: string
        fileName:
          type: string
          nullable: true
        mimeType:
          type: string
          nullable: true
        sizeBytes:
          type: integer
          minimum: 0
          nullable: true
        downloadStatus:
          type: string
          nullable: true
        failureReason:
          type: string
          nullable: true
        accessError:
          type: string
          nullable: true
        url:
          type: string
          nullable: true
        thumbnailUrl:
          type: string
          nullable: true
        storageKey:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
          nullable: true
    WhatsAppAssociationSuggestion:
      type: object
      description: A proposed link between an inbound message and a content bundle
      required:
        - sourceMessageId
        - candidateMessageId
        - candidateGroupKey
        - candidateMediaGroupId
        - candidateText
        - candidateMediaCount
        - reason
        - decision
      properties:
        sourceMessageId:
          type: string
        candidateMessageId:
          type: string
        candidateGroupKey:
          type: string
        candidateMediaGroupId:
          type: string
          nullable: true
        candidateText:
          type: string
          nullable: true
        candidateMediaCount:
          type: integer
          minimum: 0
        reason:
          type: string
        decision:
          type: string
          enum: [accepted, rejected]
          nullable: true
    WhatsAppMessage:
      type: object
      required:
        - id
        - remoteMessageId
        - messageType
        - mediaAvailable
        - media
      properties:
        id:
          type: string
        remoteMessageId:
          type: string
        senderId:
          type: string
          nullable: true
        senderName:
          type: string
          nullable: true
        messageType:
          type: string
        textBody:
          type: string
          nullable: true
        caption:
          type: string
          nullable: true
        mediaAvailable:
          type: boolean
        mediaGroupId:
          type: string
          nullable: true
        mediaGroupSource:
          type: string
          enum: [protocol_association, provider_album_container]
          nullable: true
        contentBundleId:
          type: string
          nullable: true
        contentBundleMedia:
          type: array
          items:
            $ref: "#/components/schemas/WhatsAppMessageMedia"
        mediaGroupIndex:
          type: integer
          minimum: 0
          nullable: true
        mediaGroupExpectedCount:
          type: integer
          minimum: 0
          nullable: true
        mediaDownloadStatus:
          type: string
          nullable: true
        mediaDownloadError:
          type: string
          nullable: true
        messageStatus:
          type: string
          nullable: true
        source:
          type: string
          nullable: true
        messageTimestamp:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
          nullable: true
        replyToRemoteId:
          type: string
          nullable: true
        linkedPostId:
          type: string
          nullable: true
        linkedPostStatus:
          type: string
          nullable: true
        media:
          type: array
          items:
            $ref: "#/components/schemas/WhatsAppMessageMedia"
        associationSuggestions:
          type: array
          items:
            $ref: "#/components/schemas/WhatsAppAssociationSuggestion"
    WhatsAppGroupMessagesResponse:
      type: object
      required: [groupJid, groupName, page, limit, totalCount, hasNextPage, messages]
      properties:
        groupJid:
          type: string
        groupName:
          type: string
        page:
          type: integer
          minimum: 1
        limit:
          type: integer
          minimum: 1
        totalCount:
          type: integer
          minimum: 0
        hasNextPage:
          type: boolean
        messages:
          type: array
          items:
            $ref: "#/components/schemas/WhatsAppMessage"
    WhatsAppMediaUrlResponse:
      type: object
      required: [url]
      properties:
        url:
          type: string
    ProductPublicationHistory:
      type: object
      description: One channel+account the product was actually published to
      required: [channel, accountId, permalink, createdAt, completedAt]
      properties:
        channel:
          type: string
          enum: [facebook, instagram]
        accountId:
          type: string
        permalink:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
          nullable: true
    CatalogProduct:
      type: object
      description: >-
        A product plus everything derived from it: media previews, the fields it
        is missing, and whether those omissions block publication.
      required:
        - id
        - ownerId
        - workspaceId
        - sku
        - name
        - normalizedName
        - sourceTrust
        - lastExtractionSuggestionId
        - updatedBy
        - updatedReason
        - aliases
        - description
        - price
        - currency
        - availability
        - inventoryTracked
        - stockOnHand
        - stockReserved
        - lowStockThreshold
        - status
        - mediaUrls
        - verifiedAt
        - createdAt
        - updatedAt
        - mediaPreviews
        - postIds
        - missingFields
        - missingFieldMessages
        - publicationBlockers
        - publicationBlockerMessages
        - publicationBlocked
        - advisoryFields
      properties:
        id:
          type: string
        ownerId:
          type: string
          description: The user who created the product; the workspace is the tenant
        workspaceId:
          type: string
        sku:
          type: string
          nullable: true
        name:
          type: string
        normalizedName:
          type: string
          nullable: true
          description: Match key used to spot duplicates
        sourceTrust:
          type: string
          enum: [merchant, customer, unknown]
          description: Who supplied the data, so the UI can flag customer-sourced prices
        lastExtractionSuggestionId:
          type: string
          nullable: true
        updatedBy:
          type: string
          nullable: true
        updatedReason:
          type: string
          nullable: true
        aliases:
          type: array
          items:
            type: string
        description:
          type: string
        price:
          type: string
          nullable: true
          description: Decimal as a string, to keep exact money arithmetic on the client
        currency:
          type: string
          nullable: true
        availability:
          type: string
          enum: [unknown, in_stock, out_of_stock, preorder]
        inventoryTracked:
          type: boolean
        stockOnHand:
          type: integer
        stockReserved:
          type: integer
