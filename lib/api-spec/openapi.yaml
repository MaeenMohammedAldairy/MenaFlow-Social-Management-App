openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: ai
    description: Secure AI content generation
  - name: auth
    description: Owner access control
  - name: social
    description: Social account connections
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /ai/content:
    post:
      operationId: generateAiContent
      tags: [ai]
      security:
        - bearerAuth: []
      summary: Generate Arabic social media content
      description: Generates a draft using a server-side AI provider key. Requires an authenticated owner session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiContentInput"
      responses:
        "200":
          description: Generated content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiContentResponse"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Generation limit reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: AI provider failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Provider key is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /auth/access:
    get:
      operationId: getOwnerAccess
      tags: [auth]
      security:
        - bearerAuth: []
      summary: Check whether the signed-in user is the MenaFlow owner
      responses:
        "200":
          description: Owner access result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthAccessResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Owner access is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /social/connections:
    get:
      operationId: getSocialConnections
      tags: [social]
      security:
        - bearerAuth: []
      summary: Get the owner's connected social accounts
      responses:
        "200":
          description: Current social account connections
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SocialConnectionsResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /social/meta/connect:
    post:
      operationId: postMetaConnect
      tags: [social]
      security:
        - bearerAuth: []
      summary: Start Facebook and Instagram account authorization
      responses:
        "200":
          description: Meta authorization link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetaConnectResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Meta connection is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /social/meta:
    delete:
      operationId: deleteMetaConnection
      tags: [social]
      security:
        - bearerAuth: []
      summary: Remove the owner's Meta connection from MenaFlow
      responses:
        "200":
          description: Connection removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetaDisconnectResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /social/meta/callback:
    get:
      operationId: metaOAuthCallback
      tags: [social]
      summary: Complete the Meta authorization callback
      responses:
        "302":
          description: Redirects back to the MenaFlow mobile app
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    AiContentInput:
      type: object
      additionalProperties: false
      properties:
        idea:
          type: string
          minLength: 3
          maxLength: 1200
        businessContext:
          type: string
          maxLength: 500
        provider:
          type: string
          enum: [gemini, openai]
        tone:
          type: string
          enum: [professional, friendly, promotional, concise]
        channel:
          type: string
          enum: [instagram, facebook, whatsapp]
      required: [idea, provider, tone, channel]
    AiContentResponse:
      type: object
      properties:
        content:
          type: string
        provider:
          type: string
          enum: [gemini, openai]
        model:
          type: string
      required: [content, provider, model]
    ApiError:
      type: object
      properties:
        error:
          type: string
      required: [error]
    AuthAccessResponse:
      type: object
      properties:
        authorized:
          type: boolean
      required: [authorized]
    SocialAccountStatus:
      type: object
      properties:
        accountId:
          type: string
        accountName:
          type: string
        connectedAt:
          type: string
          format: date-time
      required: [accountId, accountName, connectedAt]
    SocialConnectionsResponse:
      type: object
      properties:
        facebook:
          oneOf:
            - $ref: "#/components/schemas/SocialAccountStatus"
            - type: "null"
        instagram:
          oneOf:
            - $ref: "#/components/schemas/SocialAccountStatus"
            - type: "null"
      required: [facebook, instagram]
    MetaConnectResponse:
      type: object
      properties:
        authorizationUrl:
          type: string
          format: uri
        callbackUri:
          type: string
          format: uri
      required: [authorizationUrl, callbackUri]
    MetaDisconnectResponse:
      type: object
      properties:
        disconnected:
          type: boolean
      required: [disconnected]

