          type: integer
        review:
          type: integer
        scheduled:
          type: integer
        approved:
          type: integer
        publishing:
          type: integer
        published:
          type: integer
        failed:
          type: integer
        instagram:
          type: integer
        facebook:
          type: integer
        whatsapp:
          type: integer
      required:
        [
