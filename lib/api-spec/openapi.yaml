      properties:
        token:
          type: string
          minLength: 20
          maxLength: 200
          description: >-
            Expo push token. The prefix is deliberately not pattern-matched, so
            a future Expo token format keeps working without a spec change.
        platform:
          type: string
          enum: [ios, android, web]
        deviceId:
          type: [string, "null"]
          maxLength: 200
          description: Expo installation id when the client can supply it
      required: [token, platform]
    PushTokenRegisteredResponse:
      type: object
      properties:
        registered:
          type: boolean
        token:
          type: string
      required: [registered, token]
    PushTokenSummary:
      type: object
      properties:
        id:
          type: string
        token:
          type: string
        platform:
          type: string
          enum: [ios, android, web]
        deviceId:
          type: [string, "null"]
        enabled:
          type: boolean
          description: >-
            False once Expo reports DeviceNotRegistered, meaning the app was
            uninstalled or notifications were turned off for it.
        lastSeenAt:
          type: string
          format: date-time
      required: [id, token, platform, enabled, lastSeenAt]
    PushTokenListResponse:
      type: object
      properties:
        tokens:
          type: array
          items:
            $ref: "#/components/schemas/PushTokenSummary"
      required: [tokens]
    PushTokenRemovedResponse:
      type: object
      properties:
        removed:
          type: boolean
      required: [removed]
    ProductFieldKey:
      type: string
      description: >-
        A product field the merchant still has to fill. `price`, `currency`,
        `availability`, `media` and `name` block publication; `description` is
        advisory.
      enum: [name, description, price, currency, availability, media]
    ProductMediaPreview:
      type: object
      properties:
        id:
          type: string
        url:
          type: string
          format: uri
        mediaType:
          type: string
          enum: [image, video]
      required: [id, url, mediaType]
    CatalogProduct:
      type: object
      properties:
        id:
          type: string
          format: uuid
        sku:
          type: [string, "null"]
        name:
          type: string
        aliases:
          type: array
          items:
            type: string
        description:
          type: string
        price:
          type: [string, "null"]
        currency:
          type: [string, "null"]
        availability:
          type: string
          enum: [unknown, in_stock, out_of_stock, preorder]
        inventoryTracked:
          type: boolean
        stockOnHand:
          type: number
        stockReserved:
          type: number
        lowStockThreshold:
          type: number
        status:
          type: string
          enum: [draft, active, archived]
        mediaUrls:
          type: array
          items:
            type: string
        mediaPreviews:
          type: array
          items:
            $ref: "#/components/schemas/ProductMediaPreview"
        verifiedAt:
          type: [string, "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        postIds:
          type: array
          items:
            type: string
            format: uuid
        missingFields:
          type: array
          items:
            $ref: "#/components/schemas/ProductFieldKey"
        missingFieldMessages:
          type: array
          description: Arabic labels for missingFields, ready to render
          items:
            type: string
        publicationBlockers:
          type: array
          items:
            $ref: "#/components/schemas/ProductFieldKey"
        publicationBlockerMessages:
          type: array
          items:
            type: string
        publicationBlocked:
          type: boolean
        advisoryFields:
          type: array
          items:
            $ref: "#/components/schemas/ProductFieldKey"
      required:
        - id
        - name
        - aliases
        - description
        - availability
        - status
        - mediaUrls
        - mediaPreviews
        - postIds
        - missingFields
        - publicationBlockers
        - publicationBlocked
    ProductExtractionSourceMessage:
      type: object
      properties:
        id:
          type: string
        text:
          type: string
        senderName:
          type: [string, "null"]
        messageTimestamp:
          type: [string, "null"]
          format: date-time
        groupName:
          type: [string, "null"]
        mediaPreviews:
          type: array
          items:
            $ref: "#/components/schemas/ProductMediaPreview"
      required: [id, text, mediaPreviews]
    ProductExtractionSuggestion:
      type: object
      properties:
        id:
          type: string
          format: uuid
        sourceKey:
          type: string
        classification:
          type: string
          enum: [product, not_product]
        extractedData:
          type: object
          properties:
            name:
              type: [string, "null"]
            sku:
              type: [string, "null"]
            aliases:
              type: array
              items:
                type: string
            description:
              type: [string, "null"]
            price:
              type: [string, "null"]
            currency:
              type: [string, "null"]
            availability:
              type: [string, "null"]
              enum: [in_stock, out_of_stock, preorder, "null"]
        evidence:
          type: object
          additionalProperties:
            type: [string, "null"]
        confidence:
          type: object
          additionalProperties:
            type: number
        fieldReview:
          type: object
          additionalProperties:
            type: boolean
        missingFields:
          type: array
          items:
            $ref: "#/components/schemas/ProductFieldKey"
        missingFieldMessages:
          type: array
          items:
            type: string
        aiModel:
          type: string
          description: >-
            Model that produced the suggestion. A `+vision` suffix means the
            values were read from the message images rather than from its text,
            and the suggestion always needs a human review.
        status:
          type: string
          enum: [review, draft_created, possible_duplicate, dismissed]
        productId:
          type: [string, "null"]
          format: uuid
        possibleDuplicateProducts:
          type: array
          items:
            $ref: "#/components/schemas/CatalogProduct"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        sources:
          type: array
          items:
            $ref: "#/components/schemas/ProductExtractionSourceMessage"
      required:
        - id
        - classification
        - extractedData
        - evidence
        - confidence
        - fieldReview
        - aiModel
        - status
        - createdAt
        - sources
    ProductExtractionQueueCounts:
      type: object
      description: >-
        Extraction jobs by state. `waitingMedia` and `waitingAssociation` are the
        states only a download or a merchant decision can clear.
      properties:
        pending:
          type: integer
        processing:
          type: integer
        waitingMedia:
          type: integer
        waitingAssociation:
          type: integer
        failed:
          type: integer
        quotaPaused:
          type: integer
          description: >-
            Pending jobs held back because the workspace AI quota is exhausted.
            They resume on their own; no attempt is spent while paused.
      required:
        - pending
        - processing
        - waitingMedia
        - waitingAssociation
        - failed
        - quotaPaused
    ProductExtractionListResponse:
      type: object
      properties:
        suggestions:
          type: array
          items:
            $ref: "#/components/schemas/ProductExtractionSuggestion"
        pendingJobs:
          $ref: "#/components/schemas/ProductExtractionQueueCounts"
      required: [suggestions, pendingJobs]
    ExtractWhatsAppProductsInput:
      type: object
      properties:
        messageId:
          type: string
          description: Queue a single message again; omit to queue every unprocessed message
      additionalProperties: false
    ExtractionQuotaEstimate:
      type: object
      description: >-
        What the queued batch costs in AI quota. One extraction is one metered
        generation; a response the grounding rejects is retried once against the
        other provider, which is metered again, hence the worst case.
      properties:
        messages:
          type: integer
        estimatedGenerations:
          type: integer
        worstCaseGenerations:
          type: integer
        used:
          type: integer
        limit:
          type: integer
        remaining:
          type: integer
        fitsWithinQuota:
          type: boolean
        messagesWithinQuota:
          type: integer
      required:
        - messages
        - estimatedGenerations
        - worstCaseGenerations
        - used
        - limit
        - remaining
        - fitsWithinQuota
        - messagesWithinQuota
    ExtractWhatsAppProductsResponse:
      type: object
      properties:
        queuedMessages:
          type: integer
        quota:
          $ref: "#/components/schemas/ExtractionQuotaEstimate"
      required: [queuedMessages]
    CreateProductDraftInput:
      type: object
      properties:
        product:
          $ref: "#/components/schemas/ProductInput"
    ProductInput:
      type: object
      properties:
        sku:
          type: [string, "null"]
        name:
          type: string
        aliases:
          type: array
          items:
            type: string
        description:
          type: string
        price:
          type: [string, "null"]
        currency:
          type: [string, "null"]
        availability:
          type: string
          enum: [unknown, in_stock, out_of_stock, preorder]
        status:
          type: string
          enum: [draft, active, archived]
        mediaUrls:
          type: array
          items:
            type: string
        inventoryTracked:
          type: boolean
        stockOnHand:
          type: number
        lowStockThreshold:
          type: number
        inventoryReason:
          type: string
      required: [name, aliases, description, availability, status, mediaUrls]
    ProductDraftResponse:
      type: object
