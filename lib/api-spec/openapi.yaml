        title:
          type: string
        body:
          type: string
        channels:
          type: array
          items:
            type: string
            enum: [instagram, facebook, whatsapp]
        status:
          type: string
          enum: [draft, review, approved, scheduled, published]
        scheduledAt:
          type: string
          format: date-time
