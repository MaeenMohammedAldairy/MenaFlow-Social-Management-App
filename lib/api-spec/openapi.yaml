        called and we refused it" — two faults with different fixes that both
        look like "no messages are arriving". Null when the delivery log was not
        read for this platform.
      properties:
        count:
          type: integer
        lastAt:
          type: [string, "null"]
          format: date-time
        lastEvent:
          type: [string, "null"]
        lastHint:
          type: [string, "null"]
          description: Arabic guidance recorded for the last outcome
        acceptedCount:
          type: integer
        rejectedCount:
          type: integer
        lastRejectedEvent:
          type: [string, "null"]
        lastRejectedHint:
          type: [string, "null"]
      required:
        - count
        - acceptedCount
        - rejectedCount
    DiagnosticIssue:
      type: object
      description: One actionable problem, worded for the merchant
      properties:
        code:
          type: string
        message:
          type: string
        severity:
          type: string
          enum: [warning, critical]
      required: [code, message, severity]
    WhatsAppInboundDiagnostics:
      type: object
      description: >-
        Whether customer messages reach the server at all, which is the fact that
        separates "automatic replies are off" from "nothing is arriving".
      properties:
        deliveryConfirmed:
          type: boolean
        lastDirectMessageAt:
          type: [string, "null"]
          format: date-time
        directMessageCount:
          type: integer
        autoReplyEvents:
          type: object
          properties:
            queued:
              type: integer
            sent:
              type: integer
            failed:
              type: integer
            other:
              type: integer
            postponedByLimit:
              type: integer
              description: >-
                Waiting on a limit that lifts by itself (an exhausted AI quota,
                an unconfigured provider) rather than on the worker
          required: [queued, sent, failed, other, postponedByLimit]
        webhookSecretConfigured:
          type: boolean
        webhookUrl:
          type: [string, "null"]
          format: uri
        webhookAttempts:
          oneOf:
            - $ref: "#/components/schemas/InboundWebhookAttemptSummary"
            - type: "null"
        issues:
          type: array
          items:
            $ref: "#/components/schemas/DiagnosticIssue"
      required:
        - deliveryConfirmed
        - directMessageCount
        - autoReplyEvents
        - webhookSecretConfigured
        - webhookAttempts
        - issues
    OrphanedWhatsAppInstance:
      type: object
      description: >-
        One Evolution instance considered by the orphan sweep that runs when a
        webhook is re-registered. Instance names are
        `menaflow-` + sha256(workspaceId)[0:12], so an unclaimed instance is the
        session of a workspace that no longer exists; while it lives it can hold
        the phone's live events and every inbound message is refused as
        WHATSAPP_WEBHOOK_UNKNOWN_INSTANCE. `action` says what the server did and
        `reason` why — including why it deliberately did nothing: another
        workspace still claims the instance, it is bound to a different phone
        number, or it is not a name this app created.
      properties:
        instanceName:
          type: string
        phoneNumber:
          type: [string, "null"]
        connectionStatus:
          type: [string, "null"]
        action:
          type: string
          enum: [deleted, delete_failed, skipped, not_attempted]
        reason:
          type: string
      required: [instanceName, action, reason]
    WhatsAppOrphanCleanup:
      type: object
      description: >-
        Result of the orphan-instance sweep. `attempted` is false when Evolution
        could not be listed, in which case nothing was deleted and the counts are
        all zero — the webhook re-registration itself still succeeded.
      properties:
        attempted:
          type: boolean
        deleted:
          type: integer
        failed:
          type: integer
        skipped:
          type: integer
        instances:
          type: array
          items:
            $ref: "#/components/schemas/OrphanedWhatsAppInstance"
      required: [attempted, deleted, failed, skipped, instances]
    WhatsAppWebhookReconfiguration:
      type: object
      properties:
        ok:
          type: boolean
        instanceName:
          type: string
        webhookUrl:
          type: string
          format: uri
        reconfiguredAt:
          type: string
          format: date-time
        orphanCleanup:
          $ref: "#/components/schemas/WhatsAppOrphanCleanup"
      required: [ok, instanceName, webhookUrl, reconfiguredAt]
    MetaInboundDiagnostics:
      type: object
      description: >-
        Whether Facebook and Instagram events reach the server, with the recorded
        subscriptions and their last error.
      properties:
        deliveryConfirmed:
          type: boolean
        lastInboxItemAt:
          type: [string, "null"]
          format: date-time
        inboxItemCount:
          type: integer
        inboxCountByPlatform:
          type: object
          additionalProperties:
            type: integer
        autoReplyJobs:
          type: object
          properties:
            queued:
              type: integer
            completed:
              type: integer
            failed:
              type: integer
            skipped:
              type: integer
            postponedByLimit:
              type: integer
              description: >-
                Waiting on a limit that lifts by itself (an exhausted AI quota,
                an unconfigured provider) rather than on the worker
          required: [queued, completed, failed, skipped, postponedByLimit]
        subscriptions:
          type: array
          items:
            type: object
            properties:
              platform:
                type: string
                enum: [facebook, instagram]
              accountId:
                type: string
              subscribedFields:
                type: array
                items:
                  type: string
              subscribedAt:
                type: [string, "null"]
                format: date-time
              lastErrorCode:
                type: [string, "null"]
            required: [platform, accountId, subscribedFields, lastErrorCode]
        verifyTokenConfigured:
          type: boolean
        appSecretConfigured:
          type: boolean
        webhookAttempts:
          oneOf:
            - $ref: "#/components/schemas/InboundWebhookAttemptSummary"
            - type: "null"
        issues:
          type: array
          items:
            $ref: "#/components/schemas/DiagnosticIssue"
      required:
        - deliveryConfirmed
        - inboxItemCount
        - inboxCountByPlatform
        - autoReplyJobs
        - subscriptions
        - verifyTokenConfigured
        - appSecretConfigured
        - webhookAttempts
        - issues
    MetaAutoReplySettings:
      type: object
      properties:
        enabled:
          type: boolean
        facebookMessagesEnabled:
          type: boolean
        facebookCommentsEnabled:
          type: boolean
        instagramMessagesEnabled:
          type: boolean
        instagramCommentsEnabled:
          type: boolean
        language:
          type: string
        tone:
          type: string
        instructions:
          type: string
      required:
        - enabled
        - facebookMessagesEnabled
        - facebookCommentsEnabled
        - instagramMessagesEnabled
        - instagramCommentsEnabled
        - language
        - tone
        - instructions
    MetaAutoReplyReadiness:
      type: object
      properties:
        connected:
          type: boolean
        tokenReady:
          type: boolean
        webhookConfigured:
          type: boolean
        subscriptionReady:
          type: boolean
        messagesSubscriptionReady:
          type: boolean
        commentsSubscriptionReady:
          type: boolean
        aiConfigured:
          type: boolean
        messagesReady:
          type: boolean
        commentsReady:
          type: boolean
        missingPermissions:
          type: array
          items:
            type: string
      required:
        - connected
        - tokenReady
        - webhookConfigured
        - subscriptionReady
        - messagesSubscriptionReady
        - commentsSubscriptionReady
        - aiConfigured
        - messagesReady
        - commentsReady
        - missingPermissions
    MetaAutoReplySettingsResponse:
      type: object
      properties:
        settings:
          $ref: "#/components/schemas/MetaAutoReplySettings"
        readiness:
          type: object
          properties:
            facebook:
              $ref: "#/components/schemas/MetaAutoReplyReadiness"
            instagram:
              $ref: "#/components/schemas/MetaAutoReplyReadiness"
          required: [facebook, instagram]
        inbound:
          $ref: "#/components/schemas/MetaInboundDiagnostics"
      required: [settings, readiness, inbound]
    MetaWebhookSubscriptionResult:
      type: object
      properties:
        subscribed:
          type: boolean
        fields:
          type: array
          items:
            type: string
        errorCode:
          type: string
      required: [subscribed, fields]
    MetaWebhookSubscriptionsResponse:
      type: object
      properties:
        subscriptions:
          type: object
          properties:
            facebook:
              $ref: "#/components/schemas/MetaWebhookSubscriptionResult"
            instagram:
              $ref: "#/components/schemas/MetaWebhookSubscriptionResult"
          additionalProperties: false
      required: [subscriptions]
