openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: ai
    description: Secure AI content generation
  - name: auth
    description: Owner access control
  - name: social
    description: Social account connections
  - name: posts
    description: Post management and synchronization
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /ai/content:
    post:
      operationId: generateAiContent
      tags: [ai]
      security:
        - bearerAuth: []
      summary: Generate Arabic social media content
      description: Generates a draft using a server-side AI provider key. Requires an authenticated owner session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiContentInput"
      responses:
        "200":
          description: Generated content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiContentResponse"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Generation limit reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: AI provider failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Provider key is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /auth/access:
    get:
      operationId: getOwnerAccess
      tags: [auth]
      security:
        - bearerAuth: []
      summary: Get access and onboarding status for the signed-in user
      responses:
        "200":
          description: Owner access result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthAccessResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Owner access is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /subscription:
    get:
      operationId: getSubscription
      tags: [auth]
      security:
        - bearerAuth: []
      summary: Get the current workspace plan and monthly usage
      responses:
        "200":
          description: Current plan, usage, and available plan options
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionOverview"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Workspace selection required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /onboarding:
    get:
      operationId: getOnboardingStatus
      tags: [auth]
      security:
        - bearerAuth: []
      summary: Get onboarding progress for the current workspace
      responses:
        "200":
          description: Current onboarding state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingStatus"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Workspace selection required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /onboarding/progress:
    post:
      operationId: updateOnboardingProgress
      tags: [auth]
      security:
        - bearerAuth: []
      summary: Save onboarding progress for the current workspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OnboardingProgressInput"
      responses:
        "200":
          description: Updated onboarding state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingStatus"
        "400":
          description: Invalid progress action
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Workspace selection required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /onboarding/social-accounts/complete:
    post:
      operationId: completeSocialAccountsSetup
      tags: [auth]
      security:
        - bearerAuth: []
      summary: Mark social account setup complete for the current workspace
      responses:
        "200":
          description: Completed social account setup state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingStatus"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Workspace selection required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /social/connections:
    get:
      operationId: getSocialConnections
      tags: [social]
      security:
        - bearerAuth: []
      summary: Get the owner's connected social accounts
      responses:
        "200":
          description: Current social account connections
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SocialConnectionsResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /social/meta/connect:
    post:
      operationId: postMetaConnect
      tags: [social]
      security:
        - bearerAuth: []
      summary: Start Facebook or Instagram account authorization
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MetaConnectInput"
      responses:
        "200":
          description: Meta authorization link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetaConnectResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Meta connection is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /social/meta:
    delete:
      operationId: deleteMetaConnection
      tags: [social]
      security:
        - bearerAuth: []
      summary: Disconnect a Meta platform account owned by the authenticated user
      parameters:
        - name: platform
          in: query
          required: false
          description: Defaults to facebook for compatibility; disconnecting Facebook also removes its linked Instagram account.
          schema:
            type: string
            enum: [facebook, instagram]
      responses:
        "200":
          description: Connection removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetaDisconnectResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /social/meta/callback:
    get:
      operationId: metaOAuthCallback
      tags: [social]
      summary: Complete the Meta authorization callback
      responses:
        "302":
          description: Redirects back to the MenaFlow mobile app
  /social/whatsapp/connect:
    post:
      operationId: postWhatsAppPairingCode
      tags: [social]
      security:
        - bearerAuth: []
      summary: Reuse or create a workspace Evolution instance and request phone-code or QR pairing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WhatsAppPairingCodeInput"
      responses:
        "200":
          description: Workspace Evolution instance reused or created and pairing code generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhatsAppPairingCodeResponse"
        "400":
          description: Invalid phone number
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: WhatsApp is already connected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
          description: Evolution API could not generate a pairing code for the phone number
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Evolution API request failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Evolution API is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /social/whatsapp/connection-status:
    get:
      operationId: getWhatsAppConnectionStatus
      tags: [social]
      security:
        - bearerAuth: []
      summary: Check the live Evolution API connection state for the owner's pending instance
      parameters:
        - name: instanceName
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Current normalized Evolution state; unavailable means the provider returned an unknown state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhatsAppConnectionStatus"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: No matching pending WhatsApp connection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Evolution API request failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /social/whatsapp/auto-reply-settings:
    get:
      operationId: getWhatsAppAutoReplySettings
      tags: [social]
      security:
        - bearerAuth: []
      summary: Get the current workspace WhatsApp automatic-reply settings
      responses:
        "200":
          description: Current WhatsApp connection and automatic-reply settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhatsAppAutoReplySettingsResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: No WhatsApp connection found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    put:
      operationId: saveWhatsAppAutoReplySettings
      tags: [social]
      security:
        - bearerAuth: []
      summary: Save and optionally enable tested WhatsApp automatic replies
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WhatsAppAutoReplySettings"
      responses:
        "200":
          description: Settings saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhatsAppAutoReplySettings"
        "400":
          description: Invalid settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: WhatsApp is disconnected or the current settings have not been tested
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: AI provider is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /social/whatsapp/auto-reply-test:
    post:
      operationId: testWhatsAppAutoReply
      tags: [social]
      security:
        - bearerAuth: []
      summary: Generate a test preview without sending a WhatsApp message
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WhatsAppAutoReplyTestInput"
      responses:
        "200":
          description: Generated test reply preview
          content:
            application/json:
              schema:
                type: object
                properties:
                  reply:
                    type: string
                required: [reply]
        "400":
          description: Invalid test message or settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: WhatsApp is disconnected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Test generation rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: AI provider is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /social/whatsapp/groups:
    get:
      operationId: getWhatsAppGroups
      tags: [social]
      security:
        - bearerAuth: []
      summary: Fetch WhatsApp announcement groups for the owner's connected account
      responses:
        "200":
          description: Live announcement groups without participant or permission details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhatsAppGroupsResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: No WhatsApp account connected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: WhatsApp connection is not active
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Evolution API request failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /social/whatsapp/group-selections:
    get:
      operationId: getWhatsAppGroupSelections
      tags: [social]
      security:
        - bearerAuth: []
      summary: Get the current owner's saved WhatsApp group selections
      responses:
        "200":
          description: Saved selections for the current WhatsApp instance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhatsAppGroupSelectionsResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    put:
      operationId: saveWhatsAppGroupSelections
      tags: [social]
      security:
        - bearerAuth: []
      summary: Save selected announcement group JIDs for the current WhatsApp instance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WhatsAppGroupSelectionsInput"
      responses:
        "200":
          description: Announcement group selections saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhatsAppGroupSelectionsResponse"
        "400":
          description: Invalid selection input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: No WhatsApp account connected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: WhatsApp connection is not active
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
          description: A selected group is not currently eligible
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Evolution API request failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /social/whatsapp:
    delete:
      operationId: deleteWhatsAppConnection
      tags: [social]
      security:
        - bearerAuth: []
      summary: Disconnect WhatsApp or cancel a pending pairing
      parameters:
        - in: query
          name: cancelPairing
          required: false
          description: Cancel only an in-progress pairing without deleting saved workspace settings
          schema:
            type: boolean
      responses:
        "200":
          description: WhatsApp disconnected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhatsAppDisconnectResult"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /posts:
    get:
      operationId: getPosts
      tags: [posts]
      security:
        - bearerAuth: []
      summary: Get all posts for the current owner
      responses:
        "200":
          description: List of posts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PostItem"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      operationId: createPost
      tags: [posts]
      security:
        - bearerAuth: []
      summary: Create a new post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePostInput"
      responses:
        "201":
          description: Post created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostItem"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /posts/page:
    get:
      operationId: getPostsPage
      tags: [posts]
      security:
        - bearerAuth: []
      summary: Get a page of posts for the active workspace
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
        - name: cursor
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: One keyset-paginated page of posts
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/PostItem"
                  nextCursor:
                    type: string
                    nullable: true
                required: [items, nextCursor]
        "400":
          description: Invalid page size or cursor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /posts/known-ids:
    post:
      operationId: getKnownPostIds
      tags: [posts]
      security:
        - bearerAuth: []
      summary: Check cached post IDs in the active workspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KnownPostIdsInput"
      responses:
        "200":
          description: IDs already stored in the active workspace
          content:
            application/json:
              schema:
                type: object
                properties:
                  ids:
                    type: array
                    items:
                      type: string
                required: [ids]
        "400":
          description: Invalid ID list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /posts/{id}:
    patch:
      operationId: updatePost
      tags: [posts]
      security:
        - bearerAuth: []
      summary: Update a post
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePostInput"
      responses:
        "200":
          description: Post updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostItem"
        "404":
          description: Post not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: deletePost
      tags: [posts]
      security:
        - bearerAuth: []
      summary: Delete a post
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Post deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostDeleteResult"
        "404":
          description: Post not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    AiContentInput:
      type: object
      additionalProperties: false
      properties:
        idea:
          type: string
          minLength: 3
          maxLength: 1200
        businessContext:
          type: string
          maxLength: 500
        provider:
          type: string
          enum: [gemini, openai]
        tone:
          type: string
          enum: [professional, friendly, promotional, concise]
        channel:
          type: string
          enum: [instagram, facebook, whatsapp]
      required: [idea, provider, tone, channel]
    AiContentResponse:
      type: object
      properties:
        content:
          type: string
        provider:
          type: string
          enum: [gemini, openai]
        model:
          type: string
      required: [content, provider, model]
    ApiError:
      type: object
      properties:
        error:
          type: string
      required: [error]
    AuthAccessResponse:
      type: object
      properties:
        authorized:
          type: boolean
        onboarding:
          $ref: "#/components/schemas/OnboardingStatus"
      required: [authorized, onboarding]
    KnownPostIdsInput:
      type: object
      properties:
        ids:
          type: array
          maxItems: 1000
          items:
            type: string
            maxLength: 150
      required: [ids]
    SubscriptionPlan:
      type: object
      properties:
        id:
          type: string
          enum: [free, starter, growth]
        name:
          type: string
        monthlyPriceUsd:
          type: integer
        limits:
          type: object
          properties:
            postsCreated:
              type: integer
            aiGenerations:
              type: integer
            channels:
              type: integer
          required: [postsCreated, aiGenerations, channels]
      required: [id, name, monthlyPriceUsd, limits]
    SubscriptionUsage:
      type: object
      properties:
        postsCreated:
          type: integer
        aiGenerations:
          type: integer
        channels:
          type: integer
      required: [postsCreated, aiGenerations, channels]
    SubscriptionOverview:
      type: object
      properties:
        planId:
          type: string
          enum: [free, starter, growth]
        planName:
          type: string
        status:
          type: string
          enum: [trialing, active, canceled, past_due, free]
        trialEndsAt:
          type: string
          format: date-time
          nullable: true
        paymentAvailable:
          type: boolean
        periodKey:
          type: string
        usage:
          $ref: "#/components/schemas/SubscriptionUsage"
        plans:
          type: array
          items:
            $ref: "#/components/schemas/SubscriptionPlan"
      required:
        - planId
        - planName
        - status
        - trialEndsAt
        - paymentAvailable
        - periodKey
        - usage
        - plans
    OnboardingProgressInput:
      type: object
      additionalProperties: false
      properties:
        action:
          type: string
          enum: [advance, back, skip]
      required: [action]
    OnboardingStatus:
      type: object
      properties:
        started:
          type: boolean
        currentStep:
          type: integer
          minimum: 0
          maximum: 3
        completed:
          type: boolean
        socialAccountsCompleted:
          type: boolean
      required: [started, currentStep, completed, socialAccountsCompleted]
    SocialAccountStatus:
      type: object
      properties:
        accountId:
          type: string
        accountName:
          type: string
        connectedAt:
          type: string
          format: date-time
        connected:
          type: boolean
        connectionState:
          type: string
          enum: [connected, connecting, disconnected, failed, missing, unavailable]
        instanceName:
          type: string
        phoneNumber:
          type: string
        authorizationStatus:
          type: string
          enum: [ready, needs_reauthorization]
        authorizationReason:
          oneOf:
            - type: string
              enum: [token_expired, token_invalid, permissions_unverified, permissions_missing]
            - type: "null"
        missingPermissions:
          type: array
          items:
            type: string
        accessTokenExpiresAt:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
      required: [accountId, accountName, connectedAt]
    SocialConnectionsResponse:
      type: object
      properties:
        facebook:
          oneOf:
            - $ref: "#/components/schemas/SocialAccountStatus"
            - type: "null"
        instagram:
          oneOf:
            - $ref: "#/components/schemas/SocialAccountStatus"
            - type: "null"
        whatsapp:
          oneOf:
            - $ref: "#/components/schemas/SocialAccountStatus"
            - type: "null"
      required: [facebook, instagram]
    MetaConnectResponse:
