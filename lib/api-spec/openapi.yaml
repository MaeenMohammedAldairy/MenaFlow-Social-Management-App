        - evidence
        - confidence
        - fieldReview
        - aiModel
        - status
        - createdAt
        - sources
    ProductExtractionQueueCounts:
      type: object
      description: >-
        Extraction jobs by state. `waitingMedia` and `waitingAssociation` are the
        states only a download or a merchant decision can clear, and `noText`
        counts the messages that will never yield a product on their own.
      properties:
        pending:
          type: integer
        processing:
          type: integer
        waitingMedia:
          type: integer
        waitingAssociation:
          type: integer
        failed:
          type: integer
        quotaPaused:
          type: integer
          description: >-
            Pending jobs held back because the workspace AI quota is exhausted.
            They resume on their own; no attempt is spent while paused.
        noText:
          type: integer
          description: >-
            Jobs that completed with nothing readable to extract: a photo with no
            caption, a sticker, a voice note. Not a failure and not waiting on
            anything, so without this counter they simply vanish from the
            merchant's view. A deployment with vision extraction enabled reads the
            text visible inside stored images instead of counting them here.
      required:
        - pending
        - processing
        - waitingMedia
        - waitingAssociation
        - failed
        - quotaPaused
        - noText
    ProductExtractionSuggestionCounts:
      type: object
      description: >-
        Totals over every non-dismissed suggestion in the workspace, ignoring the
        page filters, so a badge does not change while the merchant moves between
        tabs.
      properties:
        total:
          type: integer
        product:
          type: integer
          description: Suggestions the model read as a product
        notProduct:
          type: integer
          description: Suggestions the model read as not a product
        pendingReview:
          type: integer
          description: Awaiting a decision, of either classification
        pendingProductReview:
          type: integer
          description: Awaiting a decision and holding a product — the badge number
        draftCreated:
          type: integer
        possibleDuplicate:
          type: integer
      required:
        - total
        - product
        - notProduct
        - pendingReview
        - pendingProductReview
        - draftCreated
        - possibleDuplicate
    ProductExtractionPagination:
      type: object
      properties:
        total:
          type: integer
          description: Rows matching the requested filters
        limit:
          type: integer
        offset:
          type: integer
        nextOffset:
          type: integer
          nullable: true
          description: Null when this page already held the last row
      required: [total, limit, offset, nextOffset]
    ProductExtractionListResponse:
      type: object
      properties:
        suggestions:
          type: array
          items:
            $ref: "#/components/schemas/ProductExtractionSuggestion"
        pendingJobs:
          $ref: "#/components/schemas/ProductExtractionQueueCounts"
        suggestionCounts:
          $ref: "#/components/schemas/ProductExtractionSuggestionCounts"
        pagination:
          $ref: "#/components/schemas/ProductExtractionPagination"
      required: [suggestions, pendingJobs, suggestionCounts, pagination]
    ExtractWhatsAppProductsInput:
