          type: string
        missingFields:
          type: array
          items:
            $ref: "#/components/schemas/ProductFieldKey"
        missingFieldMessages:
          type: array
          items:
            type: string
      required: [id, name, missingFields, missingFieldMessages]
    ProductPublicationConflict:
      allOf:
        - $ref: "#/components/schemas/ApiError"
        - type: object
          properties:
            incompleteProducts:
              type: array
              description: >-
                Present with code PRODUCT_FIELDS_INCOMPLETE: the products that
                stopped the request and the fields each one is missing.
              items:
                $ref: "#/components/schemas/IncompletePublicationProduct"
    DiagnosticIssue:
      type: object
      description: One actionable problem, worded for the merchant
      properties:
        code:
          type: string
        message:
          type: string
        severity:
          type: string
          enum: [warning, critical]
      required: [code, message, severity]
    WhatsAppInboundDiagnostics:
      type: object
      description: >-
        Whether customer messages reach the server at all, which is the fact that
        separates "automatic replies are off" from "nothing is arriving".
      properties:
        deliveryConfirmed:
          type: boolean
        lastDirectMessageAt:
          type: [string, "null"]
          format: date-time
        directMessageCount:
          type: integer
        autoReplyEvents:
          type: object
          properties:
            queued:
              type: integer
            sent:
              type: integer
            failed:
              type: integer
            other:
              type: integer
          required: [queued, sent, failed, other]
        webhookSecretConfigured:
          type: boolean
        webhookUrl:
          type: [string, "null"]
          format: uri
        issues:
          type: array
          items:
            $ref: "#/components/schemas/DiagnosticIssue"
      required:
        - deliveryConfirmed
        - directMessageCount
        - autoReplyEvents
        - webhookSecretConfigured
        - issues
    WhatsAppWebhookReconfiguration:
      type: object
      properties:
        ok:
          type: boolean
        instanceName:
          type: string
        webhookUrl:
          type: string
          format: uri
        reconfiguredAt:
          type: string
          format: date-time
      required: [ok, instanceName, webhookUrl, reconfiguredAt]
    MetaInboundDiagnostics:
      type: object
      description: >-
        Whether Facebook and Instagram events reach the server, with the recorded
        subscriptions and their last error.
      properties:
        deliveryConfirmed:
          type: boolean
        lastInboxItemAt:
          type: [string, "null"]
          format: date-time
        inboxItemCount:
          type: integer
        inboxCountByPlatform:
          type: object
          additionalProperties:
            type: integer
        autoReplyJobs:
          type: object
          properties:
            queued:
              type: integer
            completed:
              type: integer
            failed:
              type: integer
            skipped:
              type: integer
          required: [queued, completed, failed, skipped]
        subscriptions:
          type: array
          items:
            type: object
            properties:
              platform:
                type: string
                enum: [facebook, instagram]
              accountId:
                type: string
              subscribedFields:
                type: array
                items:
                  type: string
              subscribedAt:
                type: [string, "null"]
                format: date-time
              lastErrorCode:
                type: [string, "null"]
            required: [platform, accountId, subscribedFields, lastErrorCode]
        verifyTokenConfigured:
          type: boolean
        appSecretConfigured:
          type: boolean
        issues:
          type: array
          items:
            $ref: "#/components/schemas/DiagnosticIssue"
      required:
        - deliveryConfirmed
        - inboxItemCount
        - inboxCountByPlatform
        - autoReplyJobs
        - subscriptions
        - verifyTokenConfigured
        - appSecretConfigured
        - issues
    MetaAutoReplySettings:
