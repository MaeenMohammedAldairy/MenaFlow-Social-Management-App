    ProductExtractionDismissResponse:
      type: object
      properties:
        dismissed:
          type: boolean
      required: [dismissed]
    ProductExtractionReviewInput:
      type: object
      properties:
        field:
          type: string
          enum:
            - classification
            - grouping
            - name
            - description
            - sku
            - price
            - currency
            - availability
        correct:
          type: boolean
      required: [field, correct]
      additionalProperties: false
    ProductExtractionReviewResponse:
      type: object
      properties:
        reviewed:
          type: boolean
        field:
          type: string
        correct:
          type: boolean
      required: [reviewed, field, correct]
    PublishCatalogProductsInput:
      type: object
      properties:
        requestKey:
          type: string
          description: Client-generated idempotency key (8-128 of A-Za-z0-9._:-)
          pattern: "^[A-Za-z0-9._:-]{8,128}$"
        productIds:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: string
            format: uuid
        targets:
          type: array
          minItems: 1
          items:
            type: object
            properties:
              channel:
                type: string
                enum: [facebook, instagram]
              accountId:
                type: string
            required: [channel, accountId]
            additionalProperties: false
      required: [requestKey, productIds, targets]
    ProductPublicationJob:
      type: object
      properties:
        id:
          type: string
          format: uuid
        productId:
          type: string
          format: uuid
        channel:
          type: string
          enum: [facebook, instagram]
        accountId:
          type: string
        status:
          type: string
          enum: [queued, processing, published, failed, action_required]
        postId:
          type: [string, "null"]
          format: uuid
        permalink:
          type: [string, "null"]
          format: uri
        error:
          type: [string, "null"]
          description: >-
            Reason code. PRODUCT_FIELDS_INCOMPLETE means the listing was stopped
            because the product is missing a required field.
        attempts:
          type: integer
        startedAt:
          type: [string, "null"]
          format: date-time
        completedAt:
          type: [string, "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
      required: [id, productId, channel, accountId, status, attempts, createdAt]
    ProductPublicationSummary:
      type: object
      description: >-
        Counters over a batch of publication jobs. `inProgress` counts both
        queued and processing, because to the merchant they are the same wait.
      properties:
        total:
          type: integer
        successful:
          type: integer
        failed:
          type: integer
        inProgress:
          type: integer
        needsAction:
          type: integer
      required: [total, successful, failed, inProgress, needsAction]
    ProductPublicationSnapshot:
      type: object
      properties:
        requestKey:
          type: string
        jobs:
          type: array
          items:
            $ref: "#/components/schemas/ProductPublicationJob"
        summary:
          $ref: "#/components/schemas/ProductPublicationSummary"
      required: [requestKey, jobs, summary]
    ProductPublicationRetryInput:
      type: object
      properties:
        jobIds:
          type: array
          description: At most 50. Ids that are not failed are ignored, not rejected.
          items:
            type: string
      required: [jobIds]
      additionalProperties: false
    ProductPublicationRetryResponse:
      type: object
      description: >-
        The batch's state after retrying. Unlike the snapshot this carries no
        `requestKey`: the retried jobs may belong to several requests, so there
        is no single key to report.
      properties:
        jobs:
          type: array
          items:
            $ref: "#/components/schemas/ProductPublicationJob"
        summary:
          $ref: "#/components/schemas/ProductPublicationSummary"
      required: [jobs, summary]
    IncompletePublicationProduct:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        missingFields:
          type: array
          items:
            $ref: "#/components/schemas/ProductFieldKey"
        missingFieldMessages:
          type: array
          items:
            type: string
      required: [id, name, missingFields, missingFieldMessages]
    ProductPublicationConflict:
      allOf:
        - $ref: "#/components/schemas/ApiError"
        - type: object
          properties:
            incompleteProducts:
              type: array
              description: >-
                Present with code PRODUCT_FIELDS_INCOMPLETE: the products that
                stopped the request and the fields each one is missing.
              items:
                $ref: "#/components/schemas/IncompletePublicationProduct"
    InboundWebhookAttemptSummary:
      type: object
      description: >-
        What the provider's webhook calls did over the retention window. This is
        the evidence that separates "the provider never called us" from "it
        called and we refused it" — two faults with different fixes that both
        look like "no messages are arriving". Null when the delivery log was not
        read for this platform.
      properties:
        count:
          type: integer
        lastAt:
          type: [string, "null"]
          format: date-time
        lastEvent:
          type: [string, "null"]
        lastHint:
          type: [string, "null"]
          description: Arabic guidance recorded for the last outcome
        acceptedCount:
          type: integer
        rejectedCount:
          type: integer
        lastRejectedEvent:
          type: [string, "null"]
        lastRejectedHint:
          type: [string, "null"]
      required:
        - count
        - acceptedCount
        - rejectedCount
    DiagnosticIssue:
      type: object
      description: One actionable problem, worded for the merchant
      properties:
        code:
          type: string
        message:
          type: string
        severity:
          type: string
          enum: [warning, critical]
      required: [code, message, severity]
    WhatsAppInboundDiagnostics:
      type: object
      description: >-
        Whether customer messages reach the server at all, which is the fact that
        separates "automatic replies are off" from "nothing is arriving".
      properties:
        deliveryConfirmed:
          type: boolean
        lastDirectMessageAt:
          type: [string, "null"]
          format: date-time
        directMessageCount:
          type: integer
        autoReplyEvents:
          type: object
          properties:
            queued:
              type: integer
            sent:
              type: integer
            failed:
              type: integer
            other:
              type: integer
            postponedByLimit:
              type: integer
              description: >-
                Waiting on a limit that lifts by itself (an exhausted AI quota,
                an unconfigured provider) rather than on the worker
          required: [queued, sent, failed, other, postponedByLimit]
        webhookSecretConfigured:
          type: boolean
        webhookUrl:
          type: [string, "null"]
          format: uri
        webhookAttempts:
          oneOf:
            - $ref: "#/components/schemas/InboundWebhookAttemptSummary"
            - type: "null"
        issues:
          type: array
          items:
            $ref: "#/components/schemas/DiagnosticIssue"
      required:
        - deliveryConfirmed
        - directMessageCount
        - autoReplyEvents
        - webhookSecretConfigured
        - webhookAttempts
        - issues
    OrphanedWhatsAppInstance:
      type: object
      description: >-
        One Evolution instance considered by the orphan sweep that runs when a
        webhook is re-registered. Instance names are
        `menaflow-` + sha256(workspaceId)[0:12], so an unclaimed instance is the
        session of a workspace that no longer exists; while it lives it can hold
        the phone's live events and every inbound message is refused as
        WHATSAPP_WEBHOOK_UNKNOWN_INSTANCE. `action` says what the server did and
        `reason` why — including why it deliberately did nothing: another
        workspace still claims the instance, it is bound to a different phone
        number, or it is not a name this app created.
      properties:
        instanceName:
          type: string
        phoneNumber:
          type: [string, "null"]
        connectionStatus:
          type: [string, "null"]
        action:
          type: string
          enum: [deleted, delete_failed, skipped, not_attempted]
        reason:
          type: string
      required: [instanceName, action, reason]
    WhatsAppOrphanCleanup:
      type: object
      description: >-
        Result of the orphan-instance sweep. `attempted` is false when Evolution
        could not be listed, in which case nothing was deleted and the counts are
        all zero — the webhook re-registration itself still succeeded.
      properties:
        attempted:
          type: boolean
        deleted:
          type: integer
        failed:
          type: integer
        skipped:
          type: integer
        instances:
          type: array
          items:
            $ref: "#/components/schemas/OrphanedWhatsAppInstance"
      required: [attempted, deleted, failed, skipped, instances]
    WhatsAppWebhookReconfiguration:
      type: object
      properties:
        ok:
          type: boolean
        instanceName:
          type: string
        webhookUrl:
          type: string
          format: uri
        reconfiguredAt:
          type: string
          format: date-time
        orphanCleanup:
          $ref: "#/components/schemas/WhatsAppOrphanCleanup"
      required: [ok, instanceName, webhookUrl, reconfiguredAt]
    MetaInboundDiagnostics:
      type: object
      description: >-
        Whether Facebook and Instagram events reach the server, with the recorded
        subscriptions and their last error.
      properties:
        deliveryConfirmed:
          type: boolean
        lastInboxItemAt:
          type: [string, "null"]
          format: date-time
        inboxItemCount:
          type: integer
        inboxCountByPlatform:
          type: object
          additionalProperties:
            type: integer
        autoReplyJobs:
          type: object
          properties:
            queued:
              type: integer
            completed:
              type: integer
            failed:
              type: integer
            skipped:
              type: integer
            postponedByLimit:
              type: integer
              description: >-
                Waiting on a limit that lifts by itself (an exhausted AI quota,
                an unconfigured provider) rather than on the worker
          required: [queued, completed, failed, skipped, postponedByLimit]
        subscriptions:
          type: array
          items:
            type: object
            properties:
              platform:
                type: string
                enum: [facebook, instagram]
              accountId:
                type: string
              subscribedFields:
                type: array
                items:
                  type: string
              subscribedAt:
                type: [string, "null"]
                format: date-time
              lastErrorCode:
                type: [string, "null"]
            required: [platform, accountId, subscribedFields, lastErrorCode]
        verifyTokenConfigured:
          type: boolean
        appSecretConfigured:
          type: boolean
        webhookAttempts:
          oneOf:
            - $ref: "#/components/schemas/InboundWebhookAttemptSummary"
            - type: "null"
        issues:
          type: array
          items:
            $ref: "#/components/schemas/DiagnosticIssue"
      required:
        - deliveryConfirmed
        - lastInboxItemAt
        - inboxItemCount
        - inboxCountByPlatform
        - autoReplyJobs
        - subscriptions
        - verifyTokenConfigured
        - appSecretConfigured
        - webhookAttempts
        - issues
    MetaInboxMedia:
      type: object
      required: [type, url, thumbnailUrl]
      properties:
        type:
          type: string
        url:
          type: [string, "null"]
        thumbnailUrl:
          type: [string, "null"]
    MetaInboxItem:
      type: object
      description: >-
        One message or comment from Facebook or Instagram. `autoReplyStatus` and
        `autoReplyErrorCode` come from the job that acted on the item, so a screen
        can explain why no reply went out instead of showing a generic failure.
      required:
        - id
        - platform
        - kind
        - externalId
        - conversationId
        - parentId
        - actorId
        - actorName
        - text
        - media
        - occurredAt
        - replyText
        - repliedAt
        - replyStatus
        - autoReplyStatus
        - autoReplyErrorCode
      properties:
        id:
          type: string
        platform:
          type: string
          enum: [facebook, instagram]
        kind:
          type: string
          enum: [message, comment]
        externalId:
          type: string
        conversationId:
          type: string
        parentId:
          type: [string, "null"]
          description: The comment this one replies to, for threads.
        actorId:
          type: [string, "null"]
          description: >-
            Null when the platform did not identify the author; the conversation
            id or external id is used to group the thread instead.
        actorName:
          type: [string, "null"]
        text:
          type: string
        media:
          type: array
          items:
            $ref: "#/components/schemas/MetaInboxMedia"
        occurredAt:
          type: string
          format: date-time
        replyText:
          type: [string, "null"]
        repliedAt:
          type: [string, "null"]
          format: date-time
        replyStatus:
          type: [string, "null"]
          enum: [sending, unknown, "null"]
        autoReplyStatus:
          type: [string, "null"]
          enum: [queued, processing, sending, sent, failed, skipped, unknown, "null"]
        autoReplyErrorCode:
          type: [string, "null"]
    MetaInboxWebhookState:
