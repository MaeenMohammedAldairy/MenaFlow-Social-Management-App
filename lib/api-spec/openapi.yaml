openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: ai
    description: Secure AI content generation
  - name: auth
    description: Owner access control
  - name: social
    description: Social account connections
  - name: posts
    description: Post management and synchronization
  - name: notifications
    description: Push notification device registration
  - name: orders
    description: Order capture, status and delivery
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /ai/content:
    post:
      operationId: generateAiContent
      tags: [ai]
      security:
        - bearerAuth: []
      summary: Generate Arabic social media content
      description: Generates a draft using a server-side AI provider key. Requires an authenticated owner session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiContentInput"
      responses:
        "200":
          description: Generated content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiContentResponse"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Generation limit reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: AI provider failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Provider key is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /auth/access:
    get:
      operationId: getOwnerAccess
      tags: [auth]
      security:
        - bearerAuth: []
      summary: Get access and onboarding status for the signed-in user
      responses:
        "200":
          description: Owner access result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthAccessResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Owner access is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /workspaces:
    get:
      operationId: listWorkspaces
      tags: [auth]
      security:
        - bearerAuth: []
      summary: List workspaces the signed-in user belongs to
      responses:
        "200":
          description: Workspace memberships
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceListResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /workspaces/current:
    get:
      operationId: getWorkspaceCurrent
      tags: [workspaces]
      security:
        - bearerAuth: []
      summary: The workspace the request is scoped to
      description: >-
        Resolves the `x-workspace-id` header, or the caller's only workspace when
        the header is absent. The app uses it to label the switcher and to learn
        the caller's role, which decides what the settings screens allow.
      responses:
        "200":
          description: The workspace and the caller's role in it
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentWorkspace"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Not a member of the requested workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: The workspace could not be resolved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    patch:
      operationId: updateWorkspaceCurrent
      tags: [auth]
      security:
        - bearerAuth: []
      summary: Update the current workspace's business name and type
      description: Owner-only. Backs the concise post-signup setup and the dashboard checklist edit path.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceUpdateInput"
      responses:
        "200":
          description: The updated workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceSummary"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Not the workspace owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /workspaces/current/deletion-request:
    get:
      operationId: getWorkspaceDeletionRequest
      tags: [auth]
      security:
        - bearerAuth: []
      summary: Get the current workspace deletion request, if any
      responses:
        "200":
          description: The pending request, or null when none exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceDeletionRequestResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Owner role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      operationId: createWorkspaceDeletionRequest
      tags: [auth]
      security:
        - bearerAuth: []
      summary: Record an owner deletion request; the worker erases the workspace after a 30-day grace period
      responses:
        "201":
          description: Request recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceDeletionRequestCreatedResponse"
        "200":
          description: An existing pending request was returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceDeletionRequestCreatedResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Owner role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /workspaces/current/export:
    get:
      operationId: exportWorkspaceData
      tags: [auth]
      security:
        - bearerAuth: []
      summary: Export the current workspace's merchant data as a JSON download
      description: >-
        Owner-only. Produces a single JSON document with the workspace profile,
        members, posts, products, orders, inbox conversations and subscription
        state. Secrets (Meta/WhatsApp tokens) are never included — connections
        appear as masked metadata only.
      responses:
        "200":
          description: The workspace export document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceExport"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Owner role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /subscription:
    get:
      operationId: getSubscription
      tags: [auth]
      security:
        - bearerAuth: []
      summary: Get the current workspace plan and monthly usage
      responses:
        "200":
          description: Current plan, usage, and available plan options
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionOverview"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Workspace selection required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /onboarding:
    get:
      operationId: getOnboardingStatus
      tags: [auth]
      security:
        - bearerAuth: []
      summary: Get onboarding progress for the current workspace
      responses:
        "200":
          description: Current onboarding state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingStatus"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Workspace selection required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /onboarding/progress:
    post:
      operationId: updateOnboardingProgress
      tags: [auth]
      security:
        - bearerAuth: []
      summary: Save onboarding progress for the current workspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OnboardingProgressInput"
      responses:
        "200":
          description: Updated onboarding state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingStatus"
        "400":
          description: Invalid progress action
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Workspace selection required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /onboarding/social-accounts/complete:
    post:
      operationId: completeSocialAccountsSetup
      tags: [auth]
      security:
        - bearerAuth: []
      summary: Mark social account setup complete for the current workspace
      responses:
        "200":
          description: Completed social account setup state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingStatus"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Workspace selection required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /social/account-details/{platform}:
    get:
      operationId: getSocialAccountDetails
      tags: [social]
      security:
        - bearerAuth: []
      summary: One connected account as the platform sees it
      description: >-
        Asks the platform for the profile, permissions, metrics and recent posts,
        so a permissions problem shows as a missing permission rather than an
        empty chart. Every platform answers the same core shape; the extras are
        marked below with the platform that sends them. Field values that the
        platform did not provide are null, not missing.
      parameters:
        - name: platform
          in: path
          required: true
          schema:
            type: string
            enum: [facebook, instagram, whatsapp]
      responses:
        "200":
          description: The account, as far as the platform would say
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SocialAccountDetails"
        "400":
          description: Unknown platform
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: No such account connected to this workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: >-
            The platform could not be reached (or refused). For WhatsApp this is
            the provider's own status code.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /social/connections:
    get:
      operationId: getSocialConnections
      tags: [social]
      security:
        - bearerAuth: []
      summary: Get the owner's connected social accounts
      responses:
        "200":
          description: Current social account connections
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SocialConnectionsResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /social/meta/connect:
    post:
      operationId: postMetaConnect
      tags: [social]
      security:
        - bearerAuth: []
      summary: Start Facebook or Instagram account authorization
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MetaConnectInput"
      responses:
        "200":
          description: Meta authorization link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetaConnectResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Meta connection is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /social/meta:
    delete:
      operationId: deleteMetaConnection
      tags: [social]
      security:
        - bearerAuth: []
      summary: Disconnect a Meta platform account owned by the authenticated user
      parameters:
        - name: platform
          in: query
          required: false
          description: Defaults to facebook for compatibility; disconnecting Facebook also removes its linked Instagram account.
          schema:
            type: string
            enum: [facebook, instagram]
      responses:
        "200":
          description: Connection removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetaDisconnectResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /social/meta/callback:
    get:
      operationId: metaOAuthCallback
      tags: [social]
      summary: Complete the Meta authorization callback
      responses:
        "302":
          description: Redirects back to the MenaFlow mobile app
  /social/whatsapp/connect:
    post:
      operationId: postWhatsAppPairingCode
      tags: [social]
      security:
        - bearerAuth: []
      summary: Reuse or create a workspace Evolution instance and request phone-code or QR pairing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WhatsAppPairingCodeInput"
      responses:
        "200":
          description: Workspace Evolution instance reused or created and pairing code generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhatsAppPairingCodeResponse"
        "400":
          description: Invalid phone number
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: >-
            WhatsApp is already connected, or the phone number is actively owned
            by another workspace (code WHATSAPP_NUMBER_OWNED_BY_ANOTHER_WORKSPACE)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
          description: Evolution API could not generate a pairing code for the phone number
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Evolution API request failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Evolution API is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /social/whatsapp/connection-status:
    get:
      operationId: getWhatsAppConnectionStatus
      tags: [social]
      security:
        - bearerAuth: []
      summary: Check the live Evolution API connection state for the owner's pending instance
      parameters:
        - name: instanceName
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Current normalized Evolution state; unavailable means the provider returned an unknown state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhatsAppConnectionStatus"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: No matching pending WhatsApp connection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: >-
            The phone number became actively owned by another workspace while
            this connection was pending
            (WHATSAPP_NUMBER_OWNED_BY_ANOTHER_WORKSPACE)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Evolution API request failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /social/whatsapp/auto-reply-settings:
    get:
      operationId: getWhatsAppAutoReplySettings
      tags: [social]
      security:
        - bearerAuth: []
      summary: Get the current workspace WhatsApp automatic-reply settings
      responses:
        "200":
          description: Current WhatsApp connection and automatic-reply settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhatsAppAutoReplySettingsResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: No WhatsApp connection found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    put:
      operationId: saveWhatsAppAutoReplySettings
      tags: [social]
      security:
        - bearerAuth: []
      summary: Save and optionally enable tested WhatsApp automatic replies
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WhatsAppAutoReplySettings"
      responses:
        "200":
          description: Settings saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhatsAppAutoReplySettings"
        "400":
          description: Invalid settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: WhatsApp is disconnected or the current settings have not been tested
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: AI provider is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /social/whatsapp/auto-reply-test:
    post:
      operationId: testWhatsAppAutoReply
      tags: [social]
      security:
        - bearerAuth: []
      summary: Generate a test preview without sending a WhatsApp message
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WhatsAppAutoReplyTestInput"
      responses:
        "200":
          description: Generated test reply preview
          content:
            application/json:
              schema:
                type: object
                properties:
                  reply:
                    type: string
                required: [reply]
        "400":
          description: Invalid test message or settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: WhatsApp is disconnected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Test generation rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: AI provider is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /social/whatsapp/groups:
    get:
      operationId: getWhatsAppGroups
      tags: [social]
      security:
        - bearerAuth: []
      summary: Fetch WhatsApp announcement groups for the owner's connected account
      responses:
        "200":
          description: Live announcement groups without participant or permission details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhatsAppGroupsResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: No WhatsApp account connected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: WhatsApp connection is not active
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Evolution API request failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /social/whatsapp/group-selections:
    get:
      operationId: getWhatsAppGroupSelections
      tags: [social]
      security:
        - bearerAuth: []
      summary: Get the current owner's saved WhatsApp group selections
      responses:
        "200":
          description: Saved selections for the current WhatsApp instance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhatsAppGroupSelectionsResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    put:
      operationId: saveWhatsAppGroupSelections
      tags: [social]
      security:
        - bearerAuth: []
      summary: Save selected announcement group JIDs for the current WhatsApp instance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WhatsAppGroupSelectionsInput"
      responses:
        "200":
          description: Announcement group selections saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhatsAppGroupSelectionsResponse"
        "400":
          description: Invalid selection input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: No WhatsApp account connected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: WhatsApp connection is not active
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
          description: A selected group is not currently eligible
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Evolution API request failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /social/whatsapp:
    delete:
      operationId: deleteWhatsAppConnection
      tags: [social]
      security:
        - bearerAuth: []
      summary: Disconnect WhatsApp or cancel a pending pairing
      parameters:
        - in: query
          name: cancelPairing
          required: false
          description: Cancel only an in-progress pairing without deleting saved workspace settings
          schema:
            type: boolean
      responses:
        "200":
          description: WhatsApp disconnected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhatsAppDisconnectResult"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /social/products/whatsapp-extractions:
    get:
      operationId: getWhatsAppProductExtractions
      tags: [products]
      security:
        - bearerAuth: []
      summary: List product suggestions extracted from WhatsApp messages
      description: >-
        Returns one page of the review queue together with the extraction job
        counters and the queue's own totals, so a client can explain why nothing
        new appeared (a pending download, an association decision the merchant
        owes, or a failure) and can badge the number of suggestions that actually
        hold a product instead of counting every message the importer saw.
        Dismissed suggestions are never returned and cannot be asked for.
      parameters:
        - name: classification
          in: query
          required: false
          description: >-
            Restrict the page to one classification. Omit it for both. A
            `not_product` suggestion is a message that turned out to be a post
            candidate, a greeting or an order: it explains where a message went
            but it is not review work.
          schema:
            type: string
            enum: [product, not_product]
        - name: status
          in: query
          required: false
          description: >-
            Restrict the page to these statuses. Repeat the parameter or pass a
            comma separated list. Omit it for every status. `dismissed` is not
            selectable: a dismissed suggestion is not review work, and the list
            never returns one.
          schema:
            type: array
            items:
              type: string
              enum:
                - review
                - draft_created
                - possible_duplicate
                - update_proposed
                - accepted_update
                - rejected_update
                - superseded
          style: form
          explode: true
        - name: senderRole
          in: query
          required: false
          description: >-
            Restrict the page to who wrote the message. Useful for a merchant who
            only wants to review prices he himself quoted. Omit it for every role.
          schema:
            type: string
            enum: [merchant, customer, unknown]
        - name: limit
          in: query
          required: false
          description: Page size, clamped to 1-50. Out of range values are clamped, not rejected.
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 50
        - name: offset
          in: query
          required: false
          description: Rows to skip, clamped to 0-10000.
          schema:
            type: integer
            minimum: 0
            maximum: 10000
            default: 0
      responses:
        "200":
          description: Suggestions and extraction queue state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductExtractionListResponse"
        "400":
          description: An unknown classification or status was requested
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /social/products/extract-whatsapp:
