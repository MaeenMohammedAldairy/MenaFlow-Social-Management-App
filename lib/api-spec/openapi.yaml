    MetaConnectResponse:
      type: object
      properties:
        authorizationUrl:
          type: string
          format: uri
        callbackUri:
          type: string
          format: uri
      required: [authorizationUrl, callbackUri]
    MetaConnectInput:
      type: object
      properties:
        integration:
          type: string
          enum: [facebook, instagram]
          default: facebook
    MetaDisconnectResponse:
      type: object
      properties:
        disconnected:
          type: boolean
        alreadyDisconnected:
          type: boolean
        platform:
          type: string
          enum: [facebook, instagram]
        alsoDisconnectedInstagram:
          type: boolean
        externalRevocation:
          type: string
          enum: [unavailable]
      required: [disconnected]
    PostItem:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        body:
          type: string
        channels:
          type: array
          items:
            type: string
            enum: [instagram, facebook, whatsapp]
        status:
          type: string
          enum: [draft, review, approved, scheduled, publishing, published, failed]
          description: >-
            `publishing` while a publish attempt is in flight, `failed` when one
            failed — the two the app needs most and the contract used to omit.
        sourceType:
          type: string
          description: How the post came to exist; "manual" unless it came from a message.
        sourceMessageId:
          type: [string, "null"]
        sourceGroupJid:
          type: [string, "null"]
        sourceGroupName:
          type: [string, "null"]
        sourceMessageDate:
          type: [string, "null"]
          format: date-time
        sourceText:
          type: [string, "null"]
        metadata:
          type: object
          additionalProperties: true
        mediaUrls:
          type: array
          description: Signed URLs, valid for a limited time; re-fetch rather than cache.
          items:
            type: string
        mediaPreviewUrls:
          type: array
          items:
            type: string
        autoPublish:
          type: boolean
        autoPublishChannels:
          type: array
          items:
            type: string
            enum: [facebook, instagram, whatsapp]
        publishResults:
          type: object
          description: The last publish attempt per channel.
          additionalProperties:
            $ref: "#/components/schemas/ChannelPublishResult"
        scheduledAt:
          type: string
          format: date-time
          nullable: true
          description: Due time for posts with status "scheduled"; null otherwise.
        error:
          type: [string, "null"]
          description: Why the last publish failed, already worded for the merchant.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: [string, "null"]
          format: date-time
      required:
        - id
        - title
        - body
        - channels
        - status
        - sourceType
        - sourceMessageId
        - sourceGroupJid
        - sourceGroupName
        - sourceMessageDate
        - sourceText
        - metadata
        - mediaUrls
        - mediaPreviewUrls
        - autoPublish
        - autoPublishChannels
        - publishResults
        - scheduledAt
        - error
        - createdAt
        - updatedAt
    ChannelPublishResult:
      type: object
      required: [status]
