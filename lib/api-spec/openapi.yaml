            - type: "null"
        instagram:
          oneOf:
            - $ref: "#/components/schemas/SocialAccountStatus"
            - type: "null"
        whatsapp:
          oneOf:
            - $ref: "#/components/schemas/SocialAccountStatus"
            - type: "null"
