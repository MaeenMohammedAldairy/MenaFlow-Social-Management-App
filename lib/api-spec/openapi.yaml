        "201":
          description: Draft created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductDraftResponse"
        "400":
          description: Invalid suggestion identifier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Suggestion not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: >-
            The suggestion is not in a state a draft can be created from (already a
            draft, or already decided), or a `product` was sent for a possible
            duplicate without the `overrideReason` that has to justify it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
