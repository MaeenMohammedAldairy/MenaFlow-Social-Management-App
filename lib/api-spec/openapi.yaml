  /social/whatsapp/reconfigure-webhook:
    post:
      operationId: reconfigureWhatsAppWebhook
      tags: [social]
      security:
        - bearerAuth: []
      summary: Re-register the Evolution webhook for this workspace instance
      description: >-
        Pairing already configures the webhook; this covers the cases that break
        it afterwards (a rotated secret, a moved API domain) without re-pairing.
        The response carries the exact URL that was registered. It also sweeps
        orphaned Evolution instances bound to the same phone number — sessions
        left behind by workspaces that were deleted or migrated away, which keep
        receiving the inbound events this workspace needs — and reports each
        instance it considered. The sweep is best effort: it never fails the
        re-registration.
      responses:
        "200":
          description: Webhook re-registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhatsAppWebhookReconfiguration"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: No WhatsApp connection in this workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Evolution API rejected the configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: >-
            The webhook secret or the public API URL is not configured on the
            server (code names the missing variable)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /social/meta-auto-replies:
    get:
      operationId: getMetaAutoReplySettings
      tags: [social]
      security:
        - bearerAuth: []
      summary: Get Meta automatic-reply settings, readiness and inbound facts
      responses:
        "200":
          description: Settings, per-platform readiness and inbound diagnostics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetaAutoReplySettingsResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    put:
      operationId: saveMetaAutoReplySettings
      tags: [social]
      security:
        - bearerAuth: []
      summary: Replace the Meta automatic-reply settings
      description: >-
        A full replace, not a patch: every field is required, so a client that
        omits one resets it rather than leaving it alone. Settings can be saved
        before Meta is connected, but not before a connection exists at all.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MetaAutoReplySettings"
      responses:
        "200":
          description: The settings as saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetaAutoReplySettings"
        "400":
          description: A field is missing or out of range — a language or tone the server does not know, or instructions over 2000 characters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Meta is not connected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: The settings could not be saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /social/meta-inbox/webhook-subscriptions:
    post:
      operationId: activateMetaWebhookSubscriptions
      tags: [social]
