          type: string
        correct:
          type: boolean
      required: [reviewed, field, correct]
    PublishCatalogProductsInput:
      type: object
      properties:
        requestKey:
          type: string
          description: Client-generated idempotency key (8-128 of A-Za-z0-9._:-)
          pattern: "^[A-Za-z0-9._:-]{8,128}$"
        productIds:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: string
            format: uuid
        targets:
          type: array
          minItems: 1
          items:
            type: object
            properties:
              channel:
                type: string
                enum: [facebook, instagram]
              accountId:
                type: string
            required: [channel, accountId]
            additionalProperties: false
      required: [requestKey, productIds, targets]
    ProductPublicationJob:
      type: object
      properties:
        id:
          type: string
          format: uuid
        productId:
          type: string
          format: uuid
        channel:
          type: string
          enum: [facebook, instagram]
        accountId:
          type: string
        status:
          type: string
          enum: [queued, processing, published, failed, action_required]
        postId:
          type: [string, "null"]
          format: uuid
        permalink:
          type: [string, "null"]
          format: uri
        error:
          type: [string, "null"]
          description: >-
            Reason code. PRODUCT_FIELDS_INCOMPLETE means the listing was stopped
            because the product is missing a required field.
        attempts:
          type: integer
        startedAt:
          type: [string, "null"]
          format: date-time
        completedAt:
          type: [string, "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
      required: [id, productId, channel, accountId, status, attempts, createdAt]
    ProductPublicationSnapshot:
      type: object
      properties:
        requestKey:
          type: string
        jobs:
          type: array
          items:
            $ref: "#/components/schemas/ProductPublicationJob"
        summary:
          type: object
          properties:
            total:
              type: integer
            successful:
              type: integer
            failed:
              type: integer
            inProgress:
              type: integer
            needsAction:
              type: integer
          required: [total, successful, failed, inProgress, needsAction]
      required: [requestKey, jobs, summary]
    IncompletePublicationProduct:
      type: object
      properties:
        id:
          type: string
          format: uuid
