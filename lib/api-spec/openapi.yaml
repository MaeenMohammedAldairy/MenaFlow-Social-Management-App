    WhatsAppPairingCodeInput:
      type: object
      properties:
        phoneNumber:
          type: string
          pattern: '^\+?[1-9][0-9]{7,14}$'
        refreshCode:
          type: boolean
          description: Replace the pending Evolution instance using the same instance name before requesting a new pairing code.
      required: [phoneNumber]
    WhatsAppPairingCodeResponse:
      type: object
      description: At least one of pairingCode or qrCodeBase64 is returned.
      properties:
        instanceName:
          type: string
        phoneNumber:
          type: string
        pairingCode:
          type: string
          description: Optional phone-number pairing code.
        qrCodeBase64:
          type: string
          description: Optional QR image returned by Evolution for scanning when phone-number pairing is unavailable.
        state:
          type: string
          enum: [connecting]
      required: [instanceName, phoneNumber, state]
    WhatsAppConnectionStatus:
