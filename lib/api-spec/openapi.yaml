          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /social/whatsapp/media/{mediaId}/url:
    get:
      operationId: getWhatsAppMediaUrl
      tags: [social]
      security:
        - bearerAuth: []
      summary: Mint a fresh signed URL for a stored WhatsApp media file
      description: >-
        Signed URLs expire; this re-issues one without re-downloading. The file
        itself is served by the public signed endpoint.
      parameters:
        - name: mediaId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
        - name: variant
          in: query
          required: false
          schema:
            type: string
            enum: [original, thumbnail]
      responses:
        "200":
          description: A signed URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhatsAppMediaUrlResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Unknown media id, or the stored file is missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    OrderId:
      name: id
      in: path
      required: true
      description: Identifier of the order
      schema:
        type: string
        minLength: 1
        maxLength: 200
    ProductSuggestionId:
      name: suggestionId
      in: path
      required: true
      description: Identifier of the extraction suggestion
      schema:
        type: string
        pattern: "^[0-9a-fA-F-]{36}$"
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    AiContentInput:
      type: object
      additionalProperties: false
      properties:
        idea:
          type: string
          minLength: 3
          maxLength: 1200
        businessContext:
          type: string
          maxLength: 500
        provider:
          type: string
          enum: [gemini, openai]
        tone:
          type: string
          enum: [professional, friendly, promotional, concise]
        channel:
          type: string
          enum: [instagram, facebook, whatsapp]
      required: [idea, provider, tone, channel]
    AiContentResponse:
      type: object
      properties:
        content:
          type: string
        provider:
          type: string
          enum: [gemini, openai]
        model:
          type: string
      required: [content, provider, model]
    ApiError:
      type: object
      properties:
        error:
          type: string
        code:
          type: string
        requestId:
          type: string
      required: [error]
    OrderStatus:
      type: string
      enum: [draft, confirmed, preparing, shipped, completed, cancelled]
    DeliveryStatus:
      type: string
      enum: [pending, ready, picked_up, in_transit, delivered, failed, returned]
    CollectionStatus:
      type: string
      enum: [not_collected, collected, remitted]
    MetaConfirmationStatus:
      type: string
      enum: [not_required, queued, processing, sending, sent, manual_followup, failed, unknown]
    WhatsAppConfirmationStatus:
      type: string
      enum: [not_required, queued, processing, sending, sent, failed, unknown, manual_followup]
    OrderSummary:
      type: object
      description: Order counts for the workspace, keyed by status
      required:
        [draft, confirmed, preparing, shipped, completed, cancelled, total, metaDrafts, whatsappDrafts]
      properties:
        draft:
          type: integer
          minimum: 0
        confirmed:
          type: integer
          minimum: 0
        preparing:
          type: integer
          minimum: 0
        shipped:
          type: integer
          minimum: 0
        completed:
          type: integer
          minimum: 0
        cancelled:
          type: integer
          minimum: 0
        total:
          type: integer
          minimum: 0
        metaDrafts:
          type: integer
          minimum: 0
        whatsappDrafts:
          type: integer
          minimum: 0
    OrderItem:
      type: object
      required: [id, productId, productName, productSku, quantity, unitPrice, lineTotal]
      properties:
        id:
          type: string
        productId:
          type: string
          nullable: true
        productName:
          type: string
        productSku:
          type: string
          nullable: true
        quantity:
          type: integer
          minimum: 1
        unitPrice:
          type: string
          description: Decimal as a string, to keep exact money arithmetic on the client
        lineTotal:
          type: string
    OrderEvent:
      type: object
      required: [id, fromStatus, toStatus, createdAt]
      properties:
        id:
          type: string
        fromStatus:
          # `null` is the creation event, which has no previous status. Expressed
          # as anyOf rather than `$ref` + `nullable`, which OpenAPI 3.1 ignores.
          anyOf:
            - $ref: "#/components/schemas/OrderStatus"
            - type: "null"
        toStatus:
          $ref: "#/components/schemas/OrderStatus"
        createdAt:
          type: string
          format: date-time
    OrderDeliveryEvent:
      type: object
      required: [id, toStatus, createdAt]
      properties:
        id:
          type: string
        toStatus:
          $ref: "#/components/schemas/DeliveryStatus"
        createdAt:
          type: string
          format: date-time
    Order:
      type: object
      required:
        - id
        - orderNumber
        - customerName
        - customerPhone
        - deliveryAddress
        - notes
        - sourceMetaInboxItemId
        - sourcePlatform
        - sourceConversationId
        - sourceWhatsAppInstanceName
        - metaConfirmationStatus
        - metaConfirmationError
        - metaConfirmationSentAt
        - whatsappConfirmationStatus
        - whatsappConfirmationError
        - whatsappConfirmationSentAt
        - status
        - deliveryStatus
        - deliveryProvider
        - trackingNumber
        - deliveryFee
        - collectionStatus
        - collectedAmount
        - deliveredAt
        - currency
        - total
        - createdAt
        - updatedAt
        - items
        - events
        - deliveryEvents
      properties:
        id:
          type: string
        orderNumber:
          type: string
        customerName:
          type: string
        customerPhone:
          type: string
          nullable: true
        deliveryAddress:
          type: string
          nullable: true
        notes:
          type: string
        sourceMetaInboxItemId:
          type: string
          nullable: true
        sourcePlatform:
          type: string
          enum: [facebook, instagram, whatsapp]
          nullable: true
        sourceConversationId:
          type: string
          nullable: true
        sourceWhatsAppInstanceName:
          type: string
          nullable: true
        metaConfirmationStatus:
          $ref: "#/components/schemas/MetaConfirmationStatus"
        metaConfirmationError:
          type: string
          nullable: true
        metaConfirmationSentAt:
          type: string
          format: date-time
          nullable: true
        whatsappConfirmationStatus:
          $ref: "#/components/schemas/WhatsAppConfirmationStatus"
        whatsappConfirmationError:
          type: string
          nullable: true
        whatsappConfirmationSentAt:
          type: string
          format: date-time
          nullable: true
        status:
          $ref: "#/components/schemas/OrderStatus"
        deliveryStatus:
          $ref: "#/components/schemas/DeliveryStatus"
        deliveryProvider:
          type: string
          nullable: true
        trackingNumber:
          type: string
          nullable: true
        deliveryFee:
          type: string
          description: Decimal as a string
        collectionStatus:
          $ref: "#/components/schemas/CollectionStatus"
        collectedAmount:
          type: string
          description: Decimal as a string
        deliveredAt:
          type: string
          format: date-time
          nullable: true
        currency:
          type: string
        total:
          type: string
          description: Decimal as a string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"
        events:
          type: array
          items:
            $ref: "#/components/schemas/OrderEvent"
        deliveryEvents:
          type: array
          items:
            $ref: "#/components/schemas/OrderDeliveryEvent"
    OrderListResponse:
      type: object
      required: [orders, nextCursor]
      properties:
        orders:
          type: array
          items:
            $ref: "#/components/schemas/Order"
        nextCursor:
          type: string
          nullable: true
    OrderResponse:
      type: object
      required: [order]
      properties:
        order:
          $ref: "#/components/schemas/Order"
    CreateOrderRequest:
      type: object
      required: [clientRequestId, customerName, items]
      properties:
        clientRequestId:
          type: string
          minLength: 1
          maxLength: 200
          description: Idempotency key chosen by the client
        customerName:
          type: string
          minLength: 1
          maxLength: 200
        customerPhone:
          type: string
          maxLength: 40
        deliveryAddress:
          type: string
          maxLength: 1000
        notes:
          type: string
          maxLength: 2000
        sourceMetaInboxItemId:
          type: string
          maxLength: 200
          description: Set when the order was captured from an inbox conversation
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [productId, quantity]
            properties:
              productId:
                type: string
                minLength: 1
                maxLength: 200
              quantity:
                type: integer
                minimum: 1
    OrderStatusUpdateRequest:
      type: object
      required: [status]
      properties:
        status:
          $ref: "#/components/schemas/OrderStatus"
    OrderDeliveryUpdateRequest:
      type: object
      minProperties: 1
      properties:
        deliveryStatus:
          $ref: "#/components/schemas/DeliveryStatus"
        deliveryProvider:
          type: string
          maxLength: 200
          nullable: true
        trackingNumber:
          type: string
          maxLength: 200
          nullable: true
        deliveryFee:
          type: string
          description: Decimal as a string
        collectionStatus:
          $ref: "#/components/schemas/CollectionStatus"
        collectedAmount:
          type: string
          description: Decimal as a string
    WhatsAppSyncSettings:
      type: object
      description: Which WhatsApp content types are synced automatically
      properties:
        autoSyncEnabled:
          type: boolean
        syncMessagesEnabled:
          type: boolean
        syncImagesEnabled:
          type: boolean
        syncVideosEnabled:
          type: boolean
    WhatsAppSyncStatusGroup:
      type: object
      description: One selected group's sync state
      required:
        - groupJid
        - groupName
        - status
        - savedMessageCount
        - importedCount
        - skippedCount
        - failedCount
        - lastSyncedAt
        - lastError
        - startedAt
        - completedAt
      properties:
        groupJid:
          type: string
        groupName:
          type: string
        status:
          type: string
          description: >-
            Provider-backed state, e.g. "idle" for a selected group that has
            never been synced, "running", "completed" or "failed". Open-ended
            because the value is persisted, not enumerated by this contract.
        savedMessageCount:
          type: integer
          minimum: 0
          description: >-
            Messages currently stored for this group, counted directly rather
            than read from the sync state, so webhook-only traffic surfaces.
        importedCount:
          type: integer
          minimum: 0
        skippedCount:
          type: integer
          minimum: 0
        failedCount:
          type: integer
          minimum: 0
        lastSyncedAt:
          type: string
          format: date-time
          nullable: true
        lastError:
          type: string
          nullable: true
        startedAt:
          type: string
          format: date-time
          nullable: true
        completedAt:
          type: string
          format: date-time
          nullable: true
    WhatsAppSyncStatusResponse:
      type: object
      required:
        - autoSyncEnabled
        - syncMessagesEnabled
        - syncImagesEnabled
        - syncVideosEnabled
        - groups
      properties:
        autoSyncEnabled:
          type: boolean
        syncMessagesEnabled:
          type: boolean
        syncImagesEnabled:
          type: boolean
        syncVideosEnabled:
          type: boolean
        groups:
          type: array
          items:
            $ref: "#/components/schemas/WhatsAppSyncStatusGroup"
    WhatsAppSyncTriggerStatus:
      type: string
      description: >-
        "started" means queued (202). Every other value is a 200 that explains
        why nothing was queued.
      enum:
        - started
        - already_running
        - no_selected_groups
        - no_linked_announcement_groups
        - no_sync_options
    WhatsAppSyncTriggerResponse:
      type: object
      required: [status, groups]
      properties:
        status:
          $ref: "#/components/schemas/WhatsAppSyncTriggerStatus"
        includeHistory:
          type: boolean
          description: Only present when a sync was queued
        historyLimit:
          type: integer
          minimum: 1
          description: Only present when a sync was queued with history
        groups:
          type: array
          description: Empty unless a sync was queued or is already running
          items:
            type: object
            required: [groupJid, groupName]
            properties:
              groupJid:
                type: string
              groupName:
                type: string
    WhatsAppMessageMedia:
      type: object
      required: [id, mediaType]
      properties:
        id:
          type: string
        mediaIndex:
          type: integer
          minimum: 0
        mediaType:
          type: string
        fileName:
          type: string
          nullable: true
        mimeType:
          type: string
          nullable: true
        sizeBytes:
          type: integer
          minimum: 0
          nullable: true
        downloadStatus:
          type: string
          nullable: true
        failureReason:
          type: string
          nullable: true
        accessError:
          type: string
          nullable: true
        url:
          type: string
          nullable: true
        thumbnailUrl:
          type: string
          nullable: true
        storageKey:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
          nullable: true
    WhatsAppAssociationSuggestion:
      type: object
      description: A proposed link between an inbound message and a content bundle
      required:
        - sourceMessageId
        - candidateMessageId
        - candidateGroupKey
        - candidateMediaGroupId
        - candidateText
        - candidateMediaCount
        - reason
        - decision
      properties:
        sourceMessageId:
          type: string
        candidateMessageId:
          type: string
        candidateGroupKey:
          type: string
        candidateMediaGroupId:
          type: string
          nullable: true
        candidateText:
          type: string
          nullable: true
        candidateMediaCount:
          type: integer
          minimum: 0
        reason:
          type: string
        decision:
          type: string
          enum: [accepted, rejected]
          nullable: true
    WhatsAppMessage:
      type: object
      required:
        - id
        - remoteMessageId
        - messageType
        - mediaAvailable
        - media
      properties:
        id:
          type: string
        remoteMessageId:
          type: string
        senderId:
          type: string
          nullable: true
        senderName:
          type: string
          nullable: true
        messageType:
          type: string
        textBody:
          type: string
          nullable: true
        caption:
          type: string
          nullable: true
        mediaAvailable:
          type: boolean
        mediaGroupId:
          type: string
          nullable: true
        mediaGroupSource:
          type: string
          enum: [protocol_association, provider_album_container]
          nullable: true
        contentBundleId:
          type: string
          nullable: true
        contentBundleMedia:
          type: array
          items:
            $ref: "#/components/schemas/WhatsAppMessageMedia"
        mediaGroupIndex:
          type: integer
          minimum: 0
          nullable: true
        mediaGroupExpectedCount:
          type: integer
          minimum: 0
          nullable: true
        mediaDownloadStatus:
          type: string
          nullable: true
        mediaDownloadError:
          type: string
          nullable: true
        messageStatus:
          type: string
          nullable: true
        source:
          type: string
          nullable: true
        messageTimestamp:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
          nullable: true
        replyToRemoteId:
          type: string
          nullable: true
        linkedPostId:
          type: string
          nullable: true
        linkedPostStatus:
          type: string
          nullable: true
        media:
          type: array
          items:
            $ref: "#/components/schemas/WhatsAppMessageMedia"
        associationSuggestions:
          type: array
          items:
            $ref: "#/components/schemas/WhatsAppAssociationSuggestion"
    WhatsAppGroupMessagesResponse:
      type: object
      required: [groupJid, groupName, page, limit, totalCount, hasNextPage, messages]
      properties:
        groupJid:
          type: string
        groupName:
          type: string
        page:
          type: integer
          minimum: 1
        limit:
          type: integer
          minimum: 1
        totalCount:
          type: integer
          minimum: 0
        hasNextPage:
          type: boolean
        messages:
          type: array
          items:
            $ref: "#/components/schemas/WhatsAppMessage"
    WhatsAppMediaUrlResponse:
      type: object
      required: [url]
      properties:
        url:
          type: string
    ProductPublicationHistory:
      type: object
      description: One channel+account the product was actually published to
      required: [channel, accountId, permalink, createdAt, completedAt]
      properties:
        channel:
          type: string
          enum: [facebook, instagram]
        accountId:
          type: string
        permalink:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
          nullable: true
    CatalogProduct:
      type: object
      description: >-
        A product plus everything derived from it: media previews, the fields it
        is missing, and whether those omissions block publication.
      required:
        - id
        - ownerId
        - workspaceId
        - sku
        - name
        - normalizedName
        - sourceTrust
        - lastExtractionSuggestionId
        - updatedBy
        - updatedReason
        - aliases
        - description
        - price
        - currency
        - availability
        - inventoryTracked
        - stockOnHand
        - stockReserved
        - lowStockThreshold
        - status
        - mediaUrls
        - verifiedAt
        - createdAt
        - updatedAt
        - mediaPreviews
        - postIds
        - missingFields
        - missingFieldMessages
        - publicationBlockers
        - publicationBlockerMessages
        - publicationBlocked
        - advisoryFields
      properties:
        id:
          type: string
        ownerId:
          type: string
          description: The user who created the product; the workspace is the tenant
        workspaceId:
          type: string
        sku:
          type: string
          nullable: true
        name:
          type: string
        normalizedName:
          type: string
          nullable: true
          description: Match key used to spot duplicates
        sourceTrust:
          type: string
          enum: [merchant, customer, unknown]
          description: Who supplied the data, so the UI can flag customer-sourced prices
        lastExtractionSuggestionId:
          type: string
          nullable: true
        updatedBy:
          type: string
          nullable: true
        updatedReason:
          type: string
          nullable: true
        aliases:
          type: array
          items:
            type: string
        description:
          type: string
        price:
          type: string
          nullable: true
          description: Decimal as a string, to keep exact money arithmetic on the client
        currency:
          type: string
          nullable: true
        availability:
          type: string
          enum: [unknown, in_stock, out_of_stock, preorder]
        inventoryTracked:
          type: boolean
        stockOnHand:
          type: integer
        stockReserved:
          type: integer
        lowStockThreshold:
          type: integer
        status:
          type: string
          enum: [draft, active, archived]
        mediaUrls:
          type: array
          maxItems: 20
          description: Deduplicated and capped, not the raw column
          items:
            type: string
        verifiedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        mediaPreviews:
          type: array
          items:
            $ref: "#/components/schemas/ProductMediaPreview"
        postIds:
          type: array
          description: Posts this product is linked to
          items:
            type: string
        missingFields:
          type: array
          description: Every empty field, so the catalog can badge an incomplete product
          items:
            $ref: "#/components/schemas/ProductFieldKey"
        missingFieldMessages:
          type: array
          description: Arabic labels for the empty fields, ready to show
          items:
            type: string
        publicationBlockers:
          type: array
          description: Missing fields that stop publication
          items:
            $ref: "#/components/schemas/ProductFieldKey"
        publicationBlockerMessages:
          type: array
          items:
            type: string
        publicationBlocked:
          type: boolean
        advisoryFields:
          type: array
          description: Worth completing, but not enforced
          items:
            $ref: "#/components/schemas/ProductFieldKey"
        publicationHistory:
          type: array
          description: >-
            Newest completed publication per channel+account, only for jobs that
            actually reached "published". Returned by the catalog list; omitted
            by single-product reads.
          items:
            $ref: "#/components/schemas/ProductPublicationHistory"
    CatalogProductListResponse:
      type: object
      required: [products]
      properties:
        products:
          type: array
          items:
            $ref: "#/components/schemas/CatalogProduct"
    AuthAccessResponse:
      type: object
      properties:
        authorized:
          type: boolean
        onboarding:
          $ref: "#/components/schemas/OnboardingStatus"
      required: [authorized, onboarding]
    WorkspaceListResponse:
      type: object
      properties:
        workspaces:
          type: array
          items:
            $ref: "#/components/schemas/WorkspaceSummary"
      required: [workspaces]
    WorkspaceSummary:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        businessType:
          type: string
          nullable: true
        country:
          type: string
          nullable: true
          description: ISO 3166-1 alpha-2 country code.
        timezone:
          type: string
          description: IANA timezone used to display and capture scheduled times.
        role:
          type: string
      required: [id, name, role]
    # Named to avoid orval's operation-derived zod const names
    # (updateWorkspaceCurrent => UpdateWorkspaceCurrentBody/Response); a component
    # sharing those exact names collides with the generated consts on re-export.
    WorkspaceUpdateInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        businessType:
          type: string
          minLength: 1
          maxLength: 40
        country:
          type: string
          pattern: '^[A-Z]{2}$'
          description: ISO 3166-1 alpha-2 country code.
        timezone:
          type: string
          minLength: 1
          maxLength: 64
          description: IANA timezone name, e.g. "Asia/Aden".
    WorkspaceDeletionRequest:
      type: object
      properties:
        id:
          type: string
        status:
          type: string
          enum: [pending, completed, failed]
        requestedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
          nullable: true
      required: [id, status, requestedAt]
    # Deliberately loose: the export document grows sections over time and
    # clients treat it as a downloadable artifact, not a typed contract.
    WorkspaceExport:
      type: object
      additionalProperties: true
      properties:
        exportedAt:
          type: string
          format: date-time
      required: [exportedAt]
    WorkspaceDeletionRequestResponse:
      type: object
      properties:
        request:
          oneOf:
            - $ref: "#/components/schemas/WorkspaceDeletionRequest"
            - type: "null"
      required: [request]
    WorkspaceDeletionRequestCreatedResponse:
      type: object
      properties:
        request:
          $ref: "#/components/schemas/WorkspaceDeletionRequest"
      required: [request]
    KnownPostIdsInput:
      type: object
      properties:
        ids:
          type: array
          maxItems: 1000
          items:
            type: string
            maxLength: 150
      required: [ids]
    SubscriptionPlan:
      type: object
      properties:
        id:
          type: string
          enum: [free, starter, growth]
        name:
          type: string
        monthlyPriceUsd:
          type: integer
        limits:
          type: object
          properties:
            postsCreated:
              type: integer
            aiGenerations:
              type: integer
            channels:
              type: integer
          required: [postsCreated, aiGenerations, channels]
      required: [id, name, monthlyPriceUsd, limits]
    SubscriptionUsage:
      type: object
      properties:
        postsCreated:
          type: integer
        aiGenerations:
          type: integer
        channels:
          type: integer
      required: [postsCreated, aiGenerations, channels]
    SubscriptionOverview:
      type: object
      properties:
        planId:
          type: string
          enum: [free, starter, growth]
        planName:
          type: string
        status:
          type: string
          enum: [trialing, active, canceled, past_due, free]
        trialEndsAt:
          type: string
          format: date-time
          nullable: true
        paymentAvailable:
          type: boolean
        periodKey:
          type: string
