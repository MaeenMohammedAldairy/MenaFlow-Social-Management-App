  /posts/{id}:
    patch:
      operationId: updatePost
      tags: [posts]
      security:
        - bearerAuth: []
      summary: Update a post
      description: >-
        Owner-only. Only the properties present are changed. Content edits
        (title, body, channels, mediaUrls, metadata) are refused with 409 while
        the post is being published. Moving a post to "approved" runs the
        readiness check, and "scheduled" (or a non-null scheduledAt) requires a
        future instant.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePostInput"
      responses:
        "200":
          description: Post updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostItem"
        "400":
          description: Invalid path id or body, or a channel that cannot be published to directly (whatsapp)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Post not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: The post's content was edited while it is being published
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
          description: Not ready to approve, the schedule is not a future instant, or the media includes a file outside the workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
