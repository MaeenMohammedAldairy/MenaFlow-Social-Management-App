    WhatsAppGroupOption:
      type: object
      properties:
        groupJid:
          type: string
        groupId:
          type: string
          description: Internal identity ID when already persisted.
        kind:
          type: string
          enum: [announcement]
        name:
          type: string
        communityParentJid:
          type: string
        selected:
          type: boolean
        verifiedAt:
          type: string
          format: date-time
      required: [groupJid, kind, name, selected]
    WhatsAppGroupsResponse:
      type: object
      properties:
        groups:
          type: array
          items:
            $ref: "#/components/schemas/WhatsAppGroupOption"
      required: [groups]
    WhatsAppGroupSelectionsResponse:
      type: object
      properties:
        groups:
          type: array
          items:
            $ref: "#/components/schemas/WhatsAppGroup"
      required: [groups]
    WhatsAppGroupSelectionsInput:
      type: object
      properties:
        groupJids:
          type: array
          maxItems: 500
          uniqueItems: true
          items:
            type: string
            pattern: '^[0-9]+(?:-[0-9]+)?@g\.us$'
      required: [groupJids]
    WhatsAppDisconnectResult:
      type: object
      properties:
        disconnected:
          type: boolean
        alreadyDisconnected:
          type: boolean
        evolutionInstanceDeleted:
          type: boolean
      required: [disconnected]
    PushTokenInput:
      type: object
      additionalProperties: false
      properties:
        token:
          type: string
          minLength: 20
          maxLength: 200
          description: >-
            Expo push token. The prefix is deliberately not pattern-matched, so
            a future Expo token format keeps working without a spec change.
        platform:
          type: string
          enum: [ios, android, web]
        deviceId:
          type: [string, "null"]
          maxLength: 200
          description: Expo installation id when the client can supply it
      required: [token, platform]
    PushTokenRegisteredResponse:
      type: object
      properties:
        registered:
          type: boolean
        token:
          type: string
      required: [registered, token]
    PushTokenSummary:
      type: object
      properties:
        id:
          type: string
        token:
          type: string
        platform:
          type: string
          enum: [ios, android, web]
        deviceId:
          type: [string, "null"]
        enabled:
          type: boolean
          description: >-
            False once Expo reports DeviceNotRegistered, meaning the app was
            uninstalled or notifications were turned off for it.
        lastSeenAt:
          type: string
          format: date-time
      required: [id, token, platform, enabled, lastSeenAt]
    PushTokenListResponse:
      type: object
      properties:
        tokens:
          type: array
          items:
            $ref: "#/components/schemas/PushTokenSummary"
      required: [tokens]
    PushTokenRemovedResponse:
      type: object
      properties:
        removed:
          type: boolean
      required: [removed]
    ProductFieldKey:
      type: string
      description: >-
        A product field the merchant may still need to fill. `price`, `currency`,
        `availability`, `media` and `name` block publication; `description` is
        advisory.
      enum: [name, description, price, currency, availability, media]
    WhatsAppDirectMessageAttachment:
      type: object
      description: >-
        A stored attachment of a one-to-one WhatsApp message. `url` and
        `thumbnailUrl` are short-lived signed links to the app's own media
        route; the storage path is never exposed. `caption` is not duplicated
        here — it remains part of the message text.
      required:
        - id
        - mediaIndex
        - mediaType
        - downloadStatus
        - url
        - thumbnailUrl
        - accessError
      properties:
        id:
          type: string
        mediaIndex:
          type: integer
          minimum: 0
        mediaType:
          type: string
        mimeType:
          type: [string, "null"]
        fileName:
          type: [string, "null"]
        sizeBytes:
          type: [integer, "null"]
          minimum: 0
        downloadStatus:
          type: string
          enum: [pending, stored, failed]
        errorCode:
          type: [string, "null"]
        url:
          type: [string, "null"]
        thumbnailUrl:
          type: [string, "null"]
        accessError:
          type: [string, "null"]
    WhatsAppDirectMessage:
      type: object
      description: >-
        One message of a one-to-one WhatsApp conversation. Text and attachments
        are stored separately: `text` may carry a caption while `attachments`
        carries the stored file. `messageType` still describes text only.
      required:
        - id
        - remoteJid
        - direction
        - status
        - autoReplyStatus
        - autoReplyErrorCode
        - text
        - messageType
        - occurredAt
        - createdAt
        - errorCode
        - attachments
      properties:
        id:
          type: string
        remoteJid:
          type: string
        direction:
          type: string
          enum: [inbound, outbound]
        status:
          type: string
          enum: [received, sending, sent, failed, unknown]
          description: >-
            `unknown` means the provider took the request but never said what
            happened. It is a real state, not a failure: the app offers to
            confirm the message was not sent rather than retrying into a
            possible duplicate.
        autoReplyStatus:
          type: [string, "null"]
          description: Only set on inbound messages that the auto-replier acted on.
        autoReplyErrorCode:
          type: [string, "null"]
          description: Why the automatic reply stopped, so the app can explain it.
        text:
          type: string
          description: Empty when nothing readable was stored.
        messageType:
          type: string
          enum: [text, unknown]
          description: >-
            Whether the message held text. The server derives this from the
            stored body rather than reading a type field, so it cannot name an
            attachment type.
        occurredAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        errorCode:
          type: [string, "null"]
        attachments:
          type: array
          items:
            $ref: "#/components/schemas/WhatsAppDirectMessageAttachment"
    WhatsAppDirectMessageListResponse:
      type: object
      required: [messages, nextCursor]
      properties:
        messages:
          type: array
          items:
            $ref: "#/components/schemas/WhatsAppDirectMessage"
        nextCursor:
          description: Null once the conversation is exhausted.
          oneOf:
            - type: object
              required: [beforeTimestamp, beforeId]
              properties:
                beforeTimestamp:
                  type: string
                  format: date-time
                beforeId:
                  type: string
            - type: "null"
    WhatsAppDirectConversation:
      type: object
      required:
        - remoteJid
        - customerNumber
        - preview
        - lastDirection
        - lastStatus
        - lastMessageAt
      properties:
        remoteJid:
          type: string
        senderName:
          type: [string, "null"]
          description: >-
            The customer name from Evolution's `pushName`/`senderName` field,
            when one is available. Null means the client must show
            `customerNumber` instead. The conversation identity never changes.
        customerNumber:
          type: string
          description: >-
            The phone number where the provider supplies one; otherwise a label
            carrying the opaque id, so the row is never blank.
        preview:
          type: string
        lastDirection:
          type: string
          enum: [inbound, outbound]
        lastStatus:
          type: string
          enum: [received, sending, sent, failed, unknown]
        lastMessageAt:
          type: string
          format: date-time
    WhatsAppDirectConversationListResponse:
      type: object
      required: [conversations]
      properties:
        conversations:
          type: array
          items:
            $ref: "#/components/schemas/WhatsAppDirectConversation"
    WhatsAppDirectReplyInput:
      type: object
      required: [remoteJid, text, clientRequestId]
      properties:
        remoteJid:
          type: string
        text:
          type: string
        clientRequestId:
          type: string
          description: >-
            Chosen by the client. Replaying a request with the same id returns the
            original message instead of sending again, so a retried tap on a slow
            connection cannot double-send.
      additionalProperties: false
    WhatsAppDirectReplyResponse:
      type: object
      required: [message]
      properties:
        message:
          description: Null only if the stored row could not be read back.
          oneOf:
            - $ref: "#/components/schemas/WhatsAppDirectMessage"
            - type: "null"
        duplicate:
          type: boolean
          description: True when the request id had already been used and nothing new was sent.
    WhatsAppDirectMessageEnvelope:
      type: object
      required: [message]
      properties:
        message:
          $ref: "#/components/schemas/WhatsAppDirectMessage"
    WhatsAppDirectReplyUncertain:
      allOf:
        - $ref: "#/components/schemas/ApiError"
        - type: object
          properties:
            message:
              description: The message as stored, with status `unknown`.
              oneOf:
                - $ref: "#/components/schemas/WhatsAppDirectMessage"
                - type: "null"
    WhatsAppContentAssociationInput:
      type: object
      required: [firstMessageId, secondMessageId, decision]
      properties:
        firstMessageId:
          type: string
        secondMessageId:
          type: string
        decision:
          type: string
          enum: [accepted, rejected]
      additionalProperties: false
    WhatsAppContentAssociationDecision:
      type: object
      required: [decision, contentBundleId]
      properties:
        decision:
          type: string
          enum: [accepted, rejected]
        contentBundleId:
          type: [string, "null"]
          description: The bundle the pair was linked into. Null when rejected.
    ProductMediaPreview:
      type: object
      required: [id, url, mediaType]
      properties:
        id:
          type: string
        url:
          type: string
        mediaType:
          type: string
    ProductMediaUploadResponse:
      type: object
      required: [media]
      properties:
        media:
          type: object
          required: [id, mediaType, mediaPreview]
          properties:
            id:
              type: string
            mediaType:
              type: string
            mediaPreview:
              description: Null only if the server has no media signing key configured.
              oneOf:
                - $ref: "#/components/schemas/ProductMediaPreview"
                - type: "null"
    ProductCandidate:
      type: object
      description: A published post offered as the source of a new product.
      required: [id, title, body, mediaUrls, mediaPreviews, updatedAt]
      properties:
        id:
          type: string
        title:
          type: string
        body:
          type: string
        mediaUrls:
          type: array
          items:
            type: string
        mediaPreviews:
          type: array
          items:
            $ref: "#/components/schemas/ProductMediaPreview"
        updatedAt:
          type: string
          format: date-time
    ProductCandidateListResponse:
      type: object
      required: [candidates]
      properties:
        candidates:
          type: array
          items:
            $ref: "#/components/schemas/ProductCandidate"
    ImportedMetaPost:
      type: object
      description: >-
        A post that is already live on Facebook or Instagram and is being turned
        into a product. The image host is restricted to Meta's CDNs, so a link to
        an arbitrary site cannot be stored as product media.
      required: [platform, id, text, publishedAt, url, imageUrl, mediaType]
      properties:
        platform:
          type: string
          enum: [facebook, instagram]
        id:
          type: string
          maxLength: 500
        text:
          type: string
          maxLength: 6000
        publishedAt:
          type: [string, "null"]
          format: date-time
        url:
          type: [string, "null"]
          format: uri
        imageUrl:
          type: [string, "null"]
          format: uri
        mediaType:
          type: [string, "null"]
          maxLength: 50
    CreateCatalogProductInput:
      allOf:
        - $ref: "#/components/schemas/ProductInput"
        - type: object
          properties:
            importedMetaPost:
              description: >-
                Optional. When present, the product is linked to that post and its
                image is copied into workspace media.
              oneOf:
                - $ref: "#/components/schemas/ImportedMetaPost"
                - type: "null"
    ProductWriteResponse:
      type: object
      description: The product as the server stored it, with the posts it is linked to.
      required: [product, postIds]
      properties:
        product:
          $ref: "#/components/schemas/CatalogProduct"
        postIds:
          type: array
          items:
            type: string
    ScannedPostExtractionInput:
      type: object
      required: [text, platform, postId]
      properties:
        text:
          type: string
          maxLength: 6000
        platform:
          type: string
          enum: [facebook, instagram]
        postId:
          type: string
          maxLength: 500
      additionalProperties: false
    ScannedPostExtraction:
      type: object
      required: [classification, extractedData]
      properties:
        classification:
          type: string
          enum: [product, not_product]
        extractedData:
          description: Null when the post held no product.
          oneOf:
            - $ref: "#/components/schemas/ExtractedProductData"
            - type: "null"
    ExtractedProductData:
      type: object
      description: What the extractor read out of a message or post, before anyone edits it.
      required: [name, sku, aliases, description, price, currency, availability]
      properties:
        name:
          type: [string, "null"]
        sku:
          type: [string, "null"]
        aliases:
          type: array
          items:
            type: string
        description:
          type: [string, "null"]
        price:
          type: [string, "null"]
        currency:
          type: [string, "null"]
        availability:
          type: [string, "null"]
          enum: [in_stock, out_of_stock, preorder]
    InventoryMovement:
      type: object
      required: [id, type, stockDelta, reservedDelta, reason, createdAt]
      properties:
        id:
          type: string
        type:
          type: string
          enum: [opening_balance, adjustment, reservation, release, shipment]
        stockDelta:
          type: integer
        reservedDelta:
          type: integer
        reason:
          type: string
        createdAt:
          type: string
          format: date-time
    InventoryMovementListResponse:
      type: object
      required: [movements]
      properties:
        movements:
          type: array
          items:
            $ref: "#/components/schemas/InventoryMovement"
    ProductExtractionRestoreResponse:
      type: object
      required: [restored]
      properties:
        restored:
          type: boolean
    ProductExtractionReprocessResponse:
      type: object
      required: [rulesetVersion, queued]
      properties:
        rulesetVersion:
          type: string
          description: The version the new pass will run with, e.g. `v2`.
        queued:
          type: boolean
    ProductChangeDiff:
      type: object
      description: >-
        Field name to what it was and what it would become. Only fields that
        actually differ appear, so an empty diff means nothing to propose.
      additionalProperties:
        type: object
        required: [before, after, evidence]
        properties:
          before: {}
          after: {}
          evidence:
            type: [string, "null"]
    ProductUpdateProposalInput:
      type: object
      properties:
        productId:
          type: string
          description: >-
            Defaults to the suggestion's own match. Send it when the merchant
            picked a different product than the one the matcher chose.
      additionalProperties: false
    ProductUpdateProposalResponse:
      type: object
      required: [proposalId, diff]
      properties:
        proposalId:
          type: string
        diff:
          $ref: "#/components/schemas/ProductChangeDiff"
    ProductChangeDecisionInput:
      type: object
      required: [decision]
      properties:
        decision:
          type: string
          enum: [accepted, rejected]
      additionalProperties: false
    ProductChangeDecisionResponse:
      type: object
      required: [status, changedFields]
      properties:
        status:
          type: string
          enum: [accepted, rejected]
        changedFields:
          type: array
          description: The fields the diff covered. Empty when rejected.
          items:
            type: string
    ProductChangeRecord:
      type: object
      required:
        - id
        - workspaceId
        - productId
        - field
        - beforeValue
        - afterValue
        - sourceType
        - sourceId
        - actorId
        - createdAt
      properties:
        id:
          type: string
        workspaceId:
          type: string
        productId:
          type: string
        field:
          type: string
        beforeValue:
          description: JSON, so its shape depends on the field — a price is a string, media a list.
          nullable: true
        afterValue:
          nullable: true
        sourceType:
          type: string
          enum: [manual, extraction, order, publication]
        sourceId:
          type: [string, "null"]
        actorId:
          type: [string, "null"]
        createdAt:
          type: string
          format: date-time
    ProductChangeListResponse:
      type: object
      required: [changes]
      properties:
        changes:
          type: array
          items:
            $ref: "#/components/schemas/ProductChangeRecord"
    ProductChangeProposal:
      type: object
      required:
        - id
        - productId
        - suggestionId
        - diff
        - status
        - createdAt
        - decidedAt
        - product
        - evidence
        - senderRole
      properties:
        id:
          type: string
        productId:
          type: string
        suggestionId:
          type: string
        diff:
          $ref: "#/components/schemas/ProductChangeDiff"
        status:
          type: string
          enum: [proposed, accepted, rejected, expired]
        createdAt:
          type: string
          format: date-time
        decidedAt:
          type: [string, "null"]
          format: date-time
        product:
          description: The product the diff applies to, for showing it next to the evidence.
          oneOf:
            - type: object
              required: [id, name, sku, status]
              properties:
                id:
                  type: string
                name:
                  type: string
                sku:
                  type: [string, "null"]
                status:
                  type: string
            - type: "null"
        evidence:
          type: object
          additionalProperties:
            type: [string, "null"]
        senderRole:
          type: string
          enum: [merchant, customer, unknown]
    ProductChangeProposalListResponse:
      type: object
      required: [proposals]
      properties:
        proposals:
          type: array
          items:
            $ref: "#/components/schemas/ProductChangeProposal"
    ProductExtractionMetrics:
      type: object
      required:
        - events
        - suggestions
        - extractionSucceeded
        - extractionFailed
        - reprocessed
        - proposalsAccepted
        - conversionRate
        - daily
      properties:
        events:
          type: array
          description: Event counters, one row per event type that occurred.
          items:
            type: object
            required: [event, total]
            properties:
              event:
                type: string
              total:
                type: integer
        suggestions:
          type: array
          description: Suggestion counts broken down by status and classification.
          items:
            type: object
            required: [status, classification, total]
            properties:
              status:
                type: [string, "null"]
              classification:
                type: [string, "null"]
              total:
                type: integer
        extractionSucceeded:
          type: integer
        extractionFailed:
          type: integer
        reprocessed:
          type: integer
        proposalsAccepted:
          type: integer
        conversionRate:
          type: number
          description: Products activated over product suggestions read, 0-1.
        daily:
          type: array
          description: Succeeded and failed extractions per day, for the sparkline.
          items:
            type: object
            required: [day, event, total]
            properties:
              day:
                type: string
                description: "YYYY-MM-DD"
              event:
                type: string
              total:
                type: integer

    ProductExtractionSourceMessage:
      type: object
      properties:
        id:
          type: string
        text:
          type: string
        senderName:
          type: [string, "null"]
        messageTimestamp:
          type: [string, "null"]
          format: date-time
        groupName:
          type: [string, "null"]
        mediaPreviews:
          type: array
          items:
            $ref: "#/components/schemas/ProductMediaPreview"
      required: [id, text, mediaPreviews]
    PossibleDuplicateProduct:
      type: object
      description: >-
        The catalog product a `possible_duplicate` suggestion may already
        describe. A trimmed read-only view — the editor that resolves the
        duplicate only needs enough to recognise the existing entry.
      required: [id, name, sku, status, description, price, currency, availability]
      properties:
        id:
          type: string
        name:
          type: string
        sku:
          type: [string, "null"]
        status:
          type: string
          enum: [draft, active, archived]
        description:
          type: string
        price:
          type: [string, "null"]
        currency:
          type: [string, "null"]
        availability:
          type: string
          enum: [unknown, in_stock, out_of_stock, preorder]
    ProductExtractionSuggestion:
      type: object
      description: >-
        One message's extraction. The server returns the whole suggestion row,
        so the bookkeeping fields (`version`, `matchStrategy`, `senderRole`, the
        evidence spans) are on the wire alongside the extracted values, and the
        client uses them to explain *why* a suggestion looks the way it does.
      properties:
        id:
          type: string
          format: uuid
        sourceKey:
          type: string
        version:
          type: integer
          description: Bumped each time the suggestion is re-extracted.
        previousSuggestionId:
          type: [string, "null"]
        senderRole:
          type: string
          enum: [merchant, customer, unknown]
          description: >-
            Who wrote the message. A customer-sourced price is a question or a
            complaint, not a fact about the product, and is shown differently.
        matchStrategy:
          type: [string, "null"]
          enum: [exact_sku, exact_name, alias_match, fuzzy_candidate, new_product]
          description: How the suggestion was matched against the existing catalog.
        matchedProductId:
          type: [string, "null"]
        matchScore:
          type: [string, "null"]
          description: Decimal as a string, 0-1.
        rulesetVersion:
          type: string
        modelVersion:
          type: [string, "null"]
        overrideReason:
          type: [string, "null"]
          description: Set when the merchant created a product despite a duplicate warning.
        classification:
          type: string
          enum: [product, not_product]
        extractedData:
          type: object
          description: >-
            The extracted values, plus the extraction's own bookkeeping written in
            snake_case alongside them. Those extras are not a stable API — read the
            camelCase fields, and treat the rest as diagnostic.
          required: [name, sku, aliases, description, price, currency, availability]
          properties:
            name:
              type: [string, "null"]
            sku:
              type: [string, "null"]
            aliases:
              type: array
              items:
                type: string
            description:
              type: [string, "null"]
            price:
              type: [string, "null"]
            currency:
              type: [string, "null"]
            availability:
              type: [string, "null"]
              enum: [in_stock, out_of_stock, preorder]
            evidence_spans:
              type: object
              description: >-
                Field name to where its value came from, as character offsets into
                a source message. This is what lets the UI highlight the words a
                value was read from instead of asking the merchant to trust the
                model. A span's source may be keyed `sourceId` or `source_id`.
              additionalProperties:
                type: object
                properties:
                  sourceId:
                    type: string
                  source_id:
                    type: string
                  start:
                    type: integer
                  end:
                    type: integer
            confidence_reasons:
              type: array
              items:
                type: string
            computed_confidence:
              type: number
            self_confidence:
              type: number
            generated_sku:
              type: boolean
            sender_role:
              type: string
          additionalProperties: true
        evidence:
          type: object
          additionalProperties:
            type: [string, "null"]
        confidence:
          type: object
          additionalProperties:
            type: number
        fieldReview:
          type: object
          additionalProperties:
            type: boolean
        missingFields:
          type: array
          items:
            $ref: "#/components/schemas/ProductFieldKey"
        missingFieldMessages:
          type: array
          items:
            type: string
        aiModel:
          type: string
          description: >-
            Model that produced the suggestion. A `+vision` suffix means the
            values were read from the message images rather than from its text,
            and the suggestion always needs a human review.
        status:
          type: string
          enum:
            - review
            - draft_created
            - possible_duplicate
            - dismissed
            - superseded
            - update_proposed
            - accepted_update
            - rejected_update
        productId:
          type: [string, "null"]
          format: uuid
        possibleDuplicateProducts:
          type: array
          description: Only present when `status` is `possible_duplicate`.
          items:
            $ref: "#/components/schemas/PossibleDuplicateProduct"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        sources:
          type: array
          items:
            $ref: "#/components/schemas/ProductExtractionSourceMessage"
      required:
        - id
        - version
        - senderRole
        - classification
        - extractedData
        - evidence
        - confidence
        - fieldReview
        - aiModel
        - status
        - createdAt
        - sources
    ProductExtractionQueueCounts:
      type: object
      description: >-
        Extraction jobs by state. `waitingMedia` and `waitingAssociation` are the
        states only a download or a merchant decision can clear, and `noText`
        counts the messages that will never yield a product on their own.
      properties:
        pending:
          type: integer
        processing:
          type: integer
        waitingMedia:
          type: integer
        waitingAssociation:
          type: integer
        failed:
          type: integer
        quotaPaused:
          type: integer
          description: >-
            Pending jobs held back because the workspace AI quota is exhausted.
            They resume on their own; no attempt is spent while paused.
        noText:
          type: integer
          description: >-
            Jobs that completed with nothing readable to extract: a photo with no
            caption, a sticker, a voice note. Not a failure and not waiting on
            anything, so without this counter they simply vanish from the
            merchant's view. A deployment with vision extraction enabled reads the
            text visible inside stored images instead of counting them here.
      required:
        - pending
        - processing
        - waitingMedia
        - waitingAssociation
        - failed
        - quotaPaused
        - noText
    ProductExtractionSuggestionCounts:
      type: object
      description: >-
        Totals over every non-dismissed suggestion in the workspace, ignoring the
        page filters, so a badge does not change while the merchant moves between
        tabs.
      properties:
        total:
          type: integer
        product:
          type: integer
          description: Suggestions the model read as a product
        notProduct:
          type: integer
          description: Suggestions the model read as not a product
        pendingReview:
          type: integer
          description: Awaiting a decision, of either classification
        pendingProductReview:
          type: integer
          description: Awaiting a decision and holding a product — the badge number
        draftCreated:
          type: integer
        possibleDuplicate:
          type: integer
        updateProposed:
          type: integer
          description: Suggestions waiting on the merchant to accept or reject a change to an existing product
        acceptedUpdate:
          type: integer
        rejectedUpdate:
          type: integer
        superseded:
          type: integer
          description: Replaced by a newer extraction of the same message
      required:
        - total
        - product
        - notProduct
        - pendingReview
        - pendingProductReview
        - draftCreated
        - possibleDuplicate
        - updateProposed
        - acceptedUpdate
        - rejectedUpdate
        - superseded
    ProductExtractionPagination:
      type: object
      properties:
        total:
          type: integer
          description: Rows matching the requested filters
        limit:
          type: integer
        offset:
          type: integer
        nextOffset:
          type: integer
          nullable: true
          description: Null when this page already held the last row
      required: [total, limit, offset, nextOffset]
    ProductExtractionListResponse:
      type: object
      properties:
        suggestions:
          type: array
          items:
            $ref: "#/components/schemas/ProductExtractionSuggestion"
        pendingJobs:
          $ref: "#/components/schemas/ProductExtractionQueueCounts"
        suggestionCounts:
          $ref: "#/components/schemas/ProductExtractionSuggestionCounts"
        pagination:
          $ref: "#/components/schemas/ProductExtractionPagination"
      required: [suggestions, pendingJobs, suggestionCounts, pagination]
    ExtractWhatsAppProductsInput:
      type: object
      properties:
        messageId:
          type: string
          description: Queue a single message again; omit to queue every unprocessed message
      additionalProperties: false
    ExtractionQuotaEstimate:
      type: object
      description: >-
        What the queued batch costs in AI quota. One extraction is one metered
        generation; a response the grounding rejects is retried once against the
        other provider, which is metered again, hence the worst case.
      properties:
        messages:
          type: integer
        estimatedGenerations:
          type: integer
        worstCaseGenerations:
          type: integer
        used:
          type: integer
        limit:
          type: integer
        remaining:
          type: integer
        fitsWithinQuota:
          type: boolean
        messagesWithinQuota:
          type: integer
      required:
        - messages
        - estimatedGenerations
        - worstCaseGenerations
        - used
        - limit
        - remaining
        - fitsWithinQuota
        - messagesWithinQuota
    ExtractWhatsAppProductsResponse:
      type: object
      properties:
        queuedMessages:
          type: integer
        quota:
          $ref: "#/components/schemas/ExtractionQuotaEstimate"
      required: [queuedMessages]
    CreateProductDraftInput:
      type: object
      properties:
        product:
          description: >-
            Omit it to accept the extracted values as-is; send it when the
            merchant corrected them in the editor first.
          oneOf:
            - $ref: "#/components/schemas/ProductInput"
            - type: "null"
        overrideReason:
          type: string
          description: >-
            Required when the suggestion is `possible_duplicate` and a `product`
            is sent: it is the merchant's stated reason for creating a product
            that looks like one he already has. Without it the server refuses
            rather than silently adding a duplicate.
      additionalProperties: false
    ProductInput:
      type: object
      properties:
        sku:
          type: [string, "null"]
        name:
          type: string
        aliases:
          type: array
          items:
            type: string
        description:
          type: string
        price:
          type: [string, "null"]
        currency:
          type: [string, "null"]
        availability:
          type: string
          enum: [unknown, in_stock, out_of_stock, preorder]
        status:
          type: string
          enum: [draft, active, archived]
        mediaUrls:
          type: array
          items:
            type: string
        inventoryTracked:
          type: boolean
        stockOnHand:
          type: number
        lowStockThreshold:
          type: number
        inventoryReason:
          type: string
      required: [name, aliases, description, availability, status, mediaUrls]
    ProductDraftResponse:
      type: object
      properties:
        product:
          $ref: "#/components/schemas/CatalogProduct"
