        kind:
          type: string
          enum: [announcement]
        name:
          type: string
        communityParentJid:
          type: string
        selected:
          type: boolean
        verifiedAt:
          type: string
          format: date-time
      required: [groupJid, kind, name, selected]
    WhatsAppGroupsResponse:
