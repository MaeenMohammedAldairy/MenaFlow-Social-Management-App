name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.8.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      # Regenerating from lib/db/src/schema must produce nothing new. If it does,
      # the Drizzle schema moved and supabase/migrations/ — the only DDL that is
      # applied — has no matching change yet, which is how a query for a column
      # that does not exist reaches production. See section 4.1 of
      # docs/audit/menaflow-recommendations-2026-11-22.md.
      - name: Schema drift gate
        run: |
          pnpm --filter @workspace/db run generate
          git add -N lib/db/schema-snapshot
          if ! git diff --exit-code lib/db/schema-snapshot; then
            echo "::error::lib/db/src/schema changed without a matching migration."
            echo "Run 'pnpm --filter @workspace/db run generate', commit lib/db/schema-snapshot, and write the matching supabase/migrations/*.sql."
            exit 1
          fi
      # The generated client and Zod schemas must match lib/api-spec/openapi.yaml.
      # Orval cleans and rewrites both output folders, so any diff afterwards means
      # the contract moved without the generated code being committed — which is how
      # a handler ends up validated by a schema that no longer describes it.
      # See section 4.2 of the recommendations report.
      - name: API contract drift gate
        run: |
          pnpm --filter @workspace/api-spec codegen
          git add -N lib/api-zod lib/api-client-react
          if ! git diff --exit-code lib/api-zod lib/api-client-react; then
            echo "::error::lib/api-spec/openapi.yaml changed without regenerating the clients."
            echo "Run 'pnpm --filter @workspace/api-spec codegen' and commit lib/api-zod and lib/api-client-react."
            exit 1
          fi
      - run: pnpm test
      - run: pnpm run typecheck
      - run: pnpm --filter @workspace/api-server run build
      # CI built only the API server, so a mobile bundle that fails to compile was
      # first discovered during a store build. `expo export` is used instead of the
      # package's own build script because that one deletes static-build/, which
      # docs/PROJECT_STRUCTURE.md warns against; exporting to a temporary directory
      # is non-destructive. See section 4.5 of the recommendations report.
      - name: Build the mobile bundle (expo export)
        run: pnpm --filter @workspace/menaflow-mobile exec expo export --platform web --output-dir /tmp/expo-export
